  <!-- ====================================================== IMPOSTAZIONI -->
  <template x-if="tab==='impostazioni' && isAdmin">
    <div class="stack">
      <div class="card">
        <header>
          <h2>Ricerca automatica sul web</h2>
          <span class="badge" :class="ricerca.attiva ? 'b-ok' : 'b-wait'"
                x-text="ricerca.attiva ? 'attiva' : 'spenta'"></span>
        </header>
        <div class="body">
          <p class="hint" style="margin-top:0">
            Partendo dall'EAN o dal codice produttore trova da sola le pagine che pubblicano quel
            prodotto, ne legge i dati e li incrocia. Si imposta qui una volta e vale per tutti i clienti.
          </p>
          <div class="notice n-ok come-funziona" style="margin-bottom:14px">
            <strong>Come lavora, per non farsi bloccare.</strong>
            Da una a tre ricerche per codice, distanziate di qualche secondo, ai motori che sui codici
            funzionano davvero: prima nella lingua delle schede, così escono i negozi del tuo paese, poi
            ovunque. Si aprono solo le pagine che riportano il codice o il modello, una alla
            volta per sito, rispettando il loro robots.txt; i siti protetti da verifiche anti-bot si
            saltano e si segnalano. Se sono i motori a bloccarci, il prodotto si rimanda e si riprova
            da solo invece di finire fra i «non trovati».
          </div>

          <div class="grid-2">
            <div class="field"><label>Motore</label>
              <!-- Option scritte qui e non generate dall'API: se le option arrivano
                   dopo che Alpine ha applicato il valore, la select mostra «Spenta»
                   anche col motore salvato — sembrava un salvataggio non riuscito. -->
              <select x-model="ricerca.motore">
                <option value="">Spenta</option>
                <option value="searxng">SearXNG (tuo, consigliato)</option>
                <option value="duckduckgo">DuckDuckGo (senza chiave)</option>
                <option value="brave">Brave Search (API ufficiale)</option>
                <option value="google_cse">Google Programmable Search (API ufficiale)</option>
                <option value="serpapi">SerpAPI</option>
              </select>
              <p class="hint" x-text="ricerca.motore && ricerca.motori_disponibili && ricerca.motori_disponibili[ricerca.motore] ? ricerca.motori_disponibili[ricerca.motore].note : ''"></p>
            </div>
            <template x-if="ricercaServe('chiave')">
              <div class="field"><label>Chiave API</label>
                <input type="text" class="mono" x-model="ricerca.chiave"
                       :placeholder="ricerca.chiave_masked || 'incolla la chiave del motore'">
                <p class="hint">Vuota per non cambiarla.</p>
              </div>
            </template>
          </div>

          <template x-if="ricerca.motore === 'searxng'">
            <div class="grid-2">
              <div class="field"><label>Indirizzo di SearXNG</label>
                <input type="text" class="mono" x-model="ricerca.url" placeholder="http://searxng:8080">
                <p class="hint">
                  Il nome del container se sta sulla stessa rete Docker, altrimenti l'indirizzo
                  della LXC. Nel suo <code>settings.yml</code> serve
                  <code>search: formats: [html, json]</code>, altrimenti risponde 403.
                </p>
              </div>
              <div class="field"><label>Motori da interrogare</label>
                <input type="text" class="mono" x-model="ricerca.motori" :placeholder="ricerca.motori_predefiniti">
                <p class="hint">
                  Vuoto = quelli consigliati (<span class="mono" x-text="ricerca.motori_predefiniti"></span>).
                  Vanno bene anche se nel settings.yml sono spenti. Bing, Qwant e Mojeek sui codici
                  rispondono a caso: meglio lasciarli fuori.
                </p>
              </div>
            </div>
          </template>

          <div class="grid-2">
            <div class="field"><label>LibreTranslate (facoltativo)</label>
              <input type="text" class="mono" x-model="ricerca.lt_url" placeholder="http://libretranslate:5000">
              <p class="hint">
                Porta nella lingua delle schede (italiano, inglese, francese, tedesco, spagnolo)
                quello che si trova in un'altra lingua, senza IA esterne: un container tuo come SearXNG.
                Vuoto = le parti in un'altra lingua restano così, con un avviso.
              </p>
            </div>
            <div class="field"><label>Browser per le pagine fatte di JavaScript (facoltativo)</label>
              <input type="text" class="mono" x-model="ricerca.render_url" placeholder="http://browser:3000">
              <p class="hint">
                Un Chrome headless tuo (servizio <code>browser</code> nel compose) apre le pagine
                che a un lettore semplice arrivano vuote o con un errore. Vuoto = quelle pagine si saltano.
              </p>
            </div>
          </div>

          <template x-if="ricerca.motore === 'google_cse'">
            <div class="field" style="max-width:340px"><label>ID del motore (cx)</label>
              <input type="text" class="mono" x-model="ricerca.cx" placeholder="a1b2c3d4e5f6g7h8i">
              <p class="hint">Lo trovi nel pannello Programmable Search Engine di Google.</p>
            </div>
          </template>

          <div class="row" style="margin-top:10px">
            <button @click="salvaRicerca()">Salva</button>
            <button class="ghost" @click="svuotaCacheRicerca(false)"
                    title="Butta i «non trovato» in memoria: le ricerche fallite si rifanno da capo.">
              Svuota i tentativi a vuoto</button>
            <button class="ghost" @click="svuotaCacheRicerca(true)"
                    title="Butta anche le schede già trovate: si riscaricano al prossimo giro.">
              Svuota tutta la cache</button>
            <div class="grow"></div>
            <input type="text" class="mono" style="max-width:190px" x-model="ricercaProvaGtin"
                   placeholder="EAN o codice di prova" @keydown.enter="provaRicerca()">
            <select style="max-width:140px" x-model="ricercaProvaLingua" translate="no">
              <!-- option scritte qui: generate con x-for arrivano dopo x-model e la select mostra la prima -->
              <option value="IT" translate="no">Italiano</option><option value="EN" translate="no">English</option><option value="FR" translate="no">Français</option><option value="DE" translate="no">Deutsch</option><option value="ES" translate="no">Español</option>
            </select>
            <button class="ghost" @click="provaRicerca()" :disabled="busy"
                    x-text="busy ? 'Cerco…' : 'Prova un codice'"></button>
          </div>

          <template x-if="ricercaEsito">
            <div style="margin-top:12px">
              <div class="notice" :class="ricercaEsito.ok ? 'n-ok' : 'n-err'">
                <template x-if="ricercaEsito.ok">
                  <span>Scheda trovata su <strong x-text="ricercaEsito.origine"></strong>.</span>
                </template>
                <template x-if="!ricercaEsito.ok">
                  <span x-text="ricercaEsito.diagnosi && ricercaEsito.diagnosi.causa ? causaTesto(ricercaEsito.diagnosi.causa) : ricercaEsito.error"></span>
                </template>
              </div>
              <template x-if="ricercaEsito.product">
                <div x-html="renderProduct(ricercaEsito.product)"></div>
              </template>
              <template x-if="ricercaEsito.diagnosi">
                <details style="margin-top:10px" open>
                  <summary class="hint">Cosa è successo: motori interrogati e siti aperti</summary>
                  <div x-html="renderDiagnosi(ricercaEsito.diagnosi)"></div>
                </details>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- ======== salute della ricerca: i numeri veri di questo server -->
      <div class="card">
        <header>
          <h2>Com'è andata la ricerca</h2>
          <span class="hint">ultimi 7 giorni</span>
          <div class="grow"></div>
          <button class="ghost sm" @click="loadSalute()">Aggiorna</button>
        </header>
        <div class="body">
          <template x-if="!salute">
            <p class="hint" style="margin:0">Carico…</p>
          </template>
          <template x-if="salute && !salute.ricerche">
            <p class="hint" style="margin:0">Ancora nessuna ricerca registrata con la versione nuova: lancia un carico o una prova a lotti.</p>
          </template>
          <template x-if="salute && salute.ricerche">
            <div class="salute">
              <div class="salute-numeri">
                <div><span class="n" x-text="salute.ricerche"></span><span class="hint">codici cercati</span></div>
                <div><span class="n ok" x-text="salute.trovati"></span><span class="hint">trovati</span></div>
                <div><span class="n" x-text="Math.round(salute.trovati * 100 / salute.ricerche) + '%'"></span><span class="hint">riuscita</span></div>
              </div>
              <div class="grid-3">
                <div>
                  <h3>Perché non si trovano</h3>
                  <ul class="lista-cause">
                    <template x-for="c in salute.cause.filter(x => x.causa !== 'trovato')" :key="c.causa">
                      <li><span class="num" x-text="c.volte"></span><div x-text="causaBreve(c.causa)"></div></li>
                    </template>
                    <template x-if="!salute.cause.filter(x => x.causa !== 'trovato').length"><li class="hint">nessun mancato</li></template>
                  </ul>
                </div>
                <div>
                  <h3>Siti che rifiutano la lettura</h3>
                  <ul class="lista-cause">
                    <template x-for="sx in salute.siti_bloccati" :key="sx.dominio">
                      <li><span class="num" x-text="sx.volte"></span>
                        <div><span class="mono" translate="no" x-text="sx.dominio"></span>
                          <div class="hint" x-text="sx.motivo"></div></div></li>
                    </template>
                    <template x-if="!salute.siti_bloccati.length"><li class="hint">nessuno</li></template>
                  </ul>
                </div>
                <div>
                  <h3>Motori di ricerca</h3>
                  <ul class="lista-cause">
                    <template x-for="m in salute.motori_ora" :key="'mo'+m.motore">
                      <li class="motore">
                        <span class="badge" :class="m.stato === 'ok' ? 'b-ok' : 'b-err'" x-text="m.stato === 'ok' ? 'risponde' : 'bloccato'"></span>
                        <div><span class="mono" translate="no" x-text="m.motore"></span>
                          <span class="hint" x-show="m.stato !== 'ok' && m.motivo" x-text="' · ' + m.motivo"></span></div>
                      </li>
                    </template>
                    <template x-if="!salute.motori_ora.length">
                      <li class="hint">Nessuna ricerca da quando il portale è ripartito.</li>
                    </template>
                  </ul>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- ======== prova a lotti -->
      <div class="card">
        <header><h2>Prova a lotti</h2></header>
        <div class="body">
          <p class="hint" style="margin-top:0">
            Incolla fino a 40 codici: si cercano uno alla volta, come in un'importazione vera, senza
            toccare clienti e siti. Per ognuno vedi se si trova, dove, e se no perché.
          </p>
          <div class="aggiungi-grid">
            <textarea rows="5" class="mono" x-model="lotto.codici" placeholder="8059893356383&#10;5712608909306&#10;97924465"></textarea>
            <div>
              <div class="field"><label>Lingua delle schede</label>
                <select x-model="lotto.lingua" translate="no">
                  <!-- option scritte qui: generate con x-for arrivano dopo x-model e la select mostra la prima -->
                  <option value="IT" translate="no">Italiano</option><option value="EN" translate="no">English</option><option value="FR" translate="no">Français</option><option value="DE" translate="no">Deutsch</option><option value="ES" translate="no">Español</option>
                </select>
              </div>
              <button @click="avviaLotto()" :disabled="lotto.busy || !lotto.codici.trim()"
                      x-text="lotto.busy ? 'In corso…' : 'Avvia la prova'"></button>
            </div>
          </div>
          <template x-if="lotto.stato">
            <div style="margin-top:14px">
              <div class="row">
                <strong x-text="lotto.stato.fatti + ' di ' + lotto.stato.totale + ' cercati'"></strong>
                <span class="hint" x-text="'· trovati ' + lotto.stato.righe.filter(r => r.trovato).length"></span>
                <span class="spin" x-show="!lotto.stato.finito"></span>
              </div>
              <table class="lotto" style="margin-top:8px">
                <thead><tr><th style="width:150px">Codice</th><th>Esito</th><th class="right" style="width:170px">Scheda</th><th style="width:110px"></th></tr></thead>
                <tbody>
                  <template x-for="(r, i) in lotto.stato.righe" :key="'lr'+i">
                    <tr>
                      <td class="gtin" x-text="r.codice"></td>
                      <td>
                        <template x-if="r.trovato">
                          <div><span class="badge b-ok">trovato</span> <span x-text="r.titolo"></span>
                            <div class="hint" x-text="'su ' + r.origine + (r.conferma === 'debole' ? ' · solo per somiglianza del nome' : '')"></div></div>
                        </template>
                        <template x-if="!r.trovato">
                          <div><span class="badge b-err">non trovato</span>
                            <span x-text="r.diagnosi && r.diagnosi.causa ? causaTesto(r.diagnosi.causa) : r.errore"></span></div>
                        </template>
                      </td>
                      <td class="right hint num" x-text="r.trovato ? (r.foto + ' foto · ' + r.specifiche + ' spec. · ' + r.descrizione + ' car.') : ''"></td>
                      <td class="right"><button class="ghost sm" x-show="r.diagnosi" @click="apriDiario(r.diagnosi, r.codice)">Dettagli</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>
      </div>

      <div class="card">
        <header><h2>Aspetto del portale</h2></header>
        <div class="body">
          <p class="hint" style="margin-top:0">
            Nome, logo e favicon che i clienti vedono in alto, nella scheda del browser e nella pagina di accesso.
          </p>
          <div class="field" style="max-width:340px"><label>Nome del portale</label>
            <input type="text" x-model="brandForm.name" placeholder="TD Sync Catalog"></div>

          <div class="logo-drop" style="margin:12px 0">
            <template x-if="brandForm.logo">
              <img :src="brandForm.logo + '?v=' + logoBust" alt="">
            </template>
            <template x-if="!brandForm.logo">
              <div class="hint">Nessun logo: si mostra il nome scritto.</div>
            </template>
            <div class="grow"></div>
            <label class="btn ghost sm" style="margin:0;cursor:pointer">
              Carica logo
              <input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"
                     style="display:none" @change="uploadBrandLogo($event)">
            </label>
            <button class="danger sm" x-show="brandForm.logo" @click="removeBrandLogo()">Rimuovi</button>
          </div>
          <p class="hint" style="margin-top:-4px">
            PNG, JPG, WebP o SVG, massimo 2 MB. Va bene un logo orizzontale: viene mostrato
            alto 26 pixel in barra e fino a 54 nella pagina di accesso.
          </p>

          <div class="logo-drop favicon-drop" style="margin:16px 0 12px">
            <div class="favicon-anteprime">
              <img class="favicon-anteprima grande" :src="brandForm.favicon || '/static/favicon.svg'" alt="">
              <span class="favicon-scheda"><img :src="brandForm.favicon || '/static/favicon.svg'" alt="">
                <span translate="no" x-text="brandForm.name || 'TD Sync Catalog'"></span></span>
            </div>
            <div>
              <strong>Favicon</strong>
              <div class="hint" x-text="brandForm.favicon ? 'La tua icona' : 'Quella di serie'"></div>
            </div>
            <div class="grow"></div>
            <label class="btn ghost sm" style="margin:0;cursor:pointer">
              Carica favicon
              <input type="file" accept="image/png,image/svg+xml,image/x-icon,image/vnd.microsoft.icon,.ico,image/webp,image/jpeg"
                     style="display:none" @change="uploadBrandFavicon($event)">
            </label>
            <button class="danger sm" x-show="brandForm.favicon" @click="removeBrandFavicon()">Torna a quella di serie</button>
          </div>
          <p class="hint" style="margin-top:-4px">
            PNG quadrato da almeno 180×180 pixel (meglio 512×512), oppure SVG o ICO, massimo 1 MB. È l'icona
            della scheda del browser e dei preferiti; se è un PNG anche quella sul telefono. Vale per tutti,
            anche nella pagina di accesso.
          </p>

          <div class="row" style="margin-top:10px">
            <button @click="saveBrand()">Salva</button>
            <span class="hint">Il nome cambia dopo un ricaricamento della pagina.</span>
          </div>
        </div>
      </div>
      <div class="card">
        <header><h2>Registro attività</h2></header>
        <div class="body tight">
          <table>
            <thead><tr><th>Quando</th><th>Utente</th><th>Azione</th><th>Dettaglio</th></tr></thead>
            <tbody>
              <template x-for="(a, i) in auditRows" :key="i">
                <tr>
                  <td class="hint" x-text="fmtDate(a.at)"></td>
                  <td x-text="a.user"></td>
                  <td class="mono" x-text="a.action"></td>
                  <td class="hint" x-text="a.detail"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

</main>

<!-- AGPL-3.0: chi usa il portale deve poter arrivare al suo codice sorgente. -->
<footer class="piede" x-cloak>
  <span translate="no">{{ app_name }} {{ app_version }}</span>{% if source_url %} ·
  <a href="{{ source_url }}" target="_blank" rel="noopener">Codice sorgente</a>
  <span translate="no">(AGPL-3.0)</span>{% endif %}
</footer>

<!-- ============================================================== MODALI -->
<template x-if="modal.kind">
  <!-- Il click fuori chiude solo l'anteprima: nelle modali con campi compilati
       un click sbagliato non deve buttare via il lavoro. Esc chiude sempre. -->
  <div class="overlay" @click.self="(modal.kind==='preview' || modal.kind==='perche') && (modal.kind=null)"
       @keydown.escape.window="modal.kind=null" x-cloak>
    <div class="modal">
      <header>
        <h2 x-text="modal.title"></h2>
        <div class="grow"></div>
        <button class="x" @click="modal.kind=null" aria-label="Chiudi" title="Chiudi">&times;</button>
      </header>
      <div class="body">
        <template x-if="modal.error">
          <div class="notice n-err" style="margin-top:0" x-text="modal.error"></div>
        </template>

        <!-- anteprima prodotto -->
        <template x-if="modal.kind==='preview'">
          <div x-html="renderProduct(modal.data.product)"></div>
        </template>

        <!-- perché: il diario della ricerca -->
        <template x-if="modal.kind==='perche'">
          <div>
            <template x-if="modal.data.riprova_alle">
              <div class="notice n-warn" style="margin-top:0"
                   x-text="'Motori di ricerca bloccati: riprovo da solo alle ' + fmtOra(modal.data.riprova_alle)"></div>
            </template>
            <template x-if="!modal.data.diagnosi || !modal.data.diagnosi.causa">
              <p class="hint" style="margin-top:0">Per questa riga non c'è il diario della ricerca: è stata cercata con una versione precedente. Premi «Riprova» per averlo.</p>
            </template>
            <template x-if="modal.data.diagnosi && modal.data.diagnosi.causa">
              <div x-html="renderDiagnosi(modal.data.diagnosi)"></div>
            </template>
          </div>
        </template>

        <!-- compilazione manuale della scheda -->
        <template x-if="modal.kind==='edit'">
          <div>
            <template x-if="modal.data.status === 'not_found'">
              <div class="notice n-warn">
                Nessuna fonte conosce questo codice. Scrivi qui i dati e la scheda diventa
                pubblicabile come tutte le altre.
              </div>
            </template>
            <template x-if="modal.data.issues && modal.data.issues.length">
              <div class="notice n-err">
                Manca ancora: <span x-text="modal.data.issues.map(i => modal.data.field_labels[i] || i).join(', ')"></span>
              </div>
            </template>

            <dl class="kv" style="margin-bottom:14px">
              <dt>EAN</dt><dd class="gtin" x-text="modal.data.gtin"></dd>
              <dt>Fonte</dt><dd x-text="modal.data.source || 'nessuna'"></dd>
            </dl>

            <div class="field"><label>Nome prodotto</label>
              <input type="text" x-model="edit.title"></div>
            <div class="grid-2">
              <div class="field"><label>Marca</label><input type="text" x-model="edit.brand"></div>
              <div class="field"><label>Codice produttore</label>
                <input type="text" class="mono" x-model="edit.mpn"></div>
            </div>
            <div class="field"><label>Categoria sul sito <span class="obbl">obbligatoria</span></label>
              <select x-model.number="edit.category_id" :class="!edit.category_id && 'manca'">
                <option value="" disabled>— scegli la categoria —</option>
                <template x-for="c in catValide" :key="'ec' + c.id">
                  <option :value="c.id" :selected="c.id == edit.category_id" x-text="c.name"></option>
                </template>
              </select>
            </div>

            <div class="prezzi" style="margin:0 0 12px">
              <div class="field" style="margin:0"><label>Prezzo</label>
                <input type="text" class="mono big" x-model="edit.regular_price" placeholder="129,90"></div>
              <div class="field" style="margin:0"><label>Prezzo scontato</label>
                <input type="text" class="mono big" x-model="edit.sale_price" placeholder="facoltativo"></div>
              <p class="hint" style="grid-column:1/-1;margin:0">
                I prezzi li decidi tu: nessuna fonte li fornisce. Lo scontato, se lo metti,
                deve stare sotto il prezzo pieno o WooCommerce lo ignora.
              </p>
            </div>

            <div class="field"><label>Descrizione</label>
              <textarea x-model="edit.description" rows="6" style="font-family:var(--sans)"></textarea></div>

            <div class="field">
              <label>Immagini</label>
              <template x-for="(img, i) in edit.images" :key="'img' + i">
                <div class="row riga" style="margin-bottom:6px">
                  <input type="text" class="mono" x-model="edit.images[i]" placeholder="https://">
                  <button class="danger sm" @click="edit.images.splice(i,1)">Togli</button>
                </div>
              </template>
              <button class="ghost sm" @click="edit.images.push('')">Aggiungi immagine</button>
            </div>

            <div class="field">
              <label>Specifiche</label>
              <template x-for="(a, i) in edit.attributes" :key="'at' + i">
                <div class="row riga" style="margin-bottom:6px">
                  <input type="text" style="flex:0 0 200px" x-model="a.name" placeholder="Nome">
                  <input type="text" x-model="a.value" placeholder="Valore">
                  <button class="danger sm" @click="edit.attributes.splice(i,1)">Togli</button>
                </div>
              </template>
              <button class="ghost sm" @click="edit.attributes.push({name:'',value:''})">Aggiungi specifica</button>
            </div>
          </div>
        </template>

        <!-- cliente -->
        <template x-if="modal.kind==='client'">
          <div>
            <div class="field"><label>Nome cliente</label>
              <input type="text" x-model="modal.data.name"></div>
            <template x-if="modal.data.id">
              <div style="margin-bottom:18px">
                <div class="row" style="margin-bottom:8px">
                  <h3 style="margin:0">Fonti dati</h3>
                  <div class="grow"></div>
                </div>
                <p class="hint" style="margin-top:0">
                  Si provano in ordine finché una risponde, e le successive completano i buchi della
                  prima. Senza fonti attive vale comunque la ricerca sul web; un connettore JSON serve
                  quando un fornitore ti dà accesso al suo catalogo.
                </p>

                <div class="fonti">
                  <template x-for="(preset, chiave) in presetFonti" :key="chiave">
                    <div class="fonte" :class="fonteAttiva(chiave) && 'attiva'">
                      <div class="fonte-testa">
                        <strong x-text="t(preset.name)"></strong>
                        <span class="badge" :class="fonteAttiva(chiave) ? 'b-ok' : 'b-wait'"
                              x-text="fonteAttiva(chiave) ? 'attiva' : 'spenta'"></span>
                      </div>
                      <p class="hint" x-text="preset.descrizione"></p>
                      <div class="row">
                        <template x-if="fonteAttiva(chiave)">
                          <button class="ghost" @click="editProvider(fonteAttiva(chiave))">Impostazioni</button>
                        </template>
                        <template x-if="!fonteAttiva(chiave)">
                          <button @click="aggiungiFonte(chiave)">Attiva</button>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>

                <template x-if="clientProviders.length">
                  <div class="row" style="margin-top:14px">
                    <input type="text" class="mono" style="max-width:190px" x-model="confrontoGtin"
                           placeholder="EAN da confrontare">
                    <button class="ghost" @click="confrontaFonti()">Confronta le fonti</button>
                    <span class="hint">Interroga ogni fonte separatamente sullo stesso codice.</span>
                  </div>
                </template>

                <template x-if="confronto.length">
                  <table style="margin-top:12px">
                    <thead><tr><th>Fonte</th><th>Cosa restituisce</th><th class="right">Contenuti</th></tr></thead>
                    <tbody>
                      <template x-for="e in confronto" :key="e.fonte">
                        <tr>
                          <td>
                            <span class="badge" :class="e.ok ? 'b-ok' : 'b-err'" x-text="e.fonte"></span>
                            <div class="hint" x-show="e.origine" x-text="'da ' + e.origine"></div>
                          </td>
                          <td>
                            <template x-if="e.ok">
                              <div>
                                <div x-text="e.titolo"></div>
                                <div class="hint" x-text="[e.marca, e.mpn, e.categoria].filter(Boolean).join(' · ')"></div>
                              </div>
                            </template>
                            <template x-if="!e.ok">
                              <span class="hint" x-text="e.errore || 'nessuna scheda'"></span>
                            </template>
                          </td>
                          <td class="right hint num">
                            <template x-if="e.ok">
                              <span x-text="e.descrizione + ' car. · ' + e.immagini + ' img · ' + e.caratteristiche + ' spec.'"></span>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>

                <template x-if="clientProviders.length">
                  <table style="margin-top:14px">
                    <thead><tr><th>Ordine</th><th>Fonte</th><th>Ultimo esito</th><th></th></tr></thead>
                    <tbody>
                      <template x-for="pr in clientProviders" :key="pr.id">
                        <tr>
                          <td class="num" x-text="pr.priority"></td>
                          <td>
                            <div x-text="t(pr.name)"></div>
                            <div class="hint mono" x-show="pr.endpoint"
                                 x-text="(pr.endpoint || '').split('\n')[0].slice(0, 46)"></div>
                          </td>
                          <td>
                            <span class="badge" :class="pr.last_error ? 'b-err' : (pr.last_ok_at ? 'b-ok' : 'b-wait')"
                                  x-text="pr.last_error ? 'errore' : (pr.last_ok_at ? 'ok' : 'mai usata')"></span>
                            <div class="hint" x-text="pr.last_error"></div>
                          </td>
                          <td class="right"><button class="ghost" @click="editProvider(pr)">Apri</button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
              </div>
            </template>

            <div class="field" style="max-width:340px"><label>Lingua delle schede</label>
              <select x-model="modal.data.content_lang" translate="no">
                <!-- option scritte qui: generate con x-for arrivano dopo x-model e la select mostra la prima -->
                <option value="IT" translate="no">Italiano</option><option value="EN" translate="no">English</option><option value="FR" translate="no">Français</option><option value="DE" translate="no">Deutsch</option><option value="ES" translate="no">Español</option>
              </select>
              <p class="hint">Quella usata dagli aggiornamenti notturni e dai negozi senza una lingua propria.</p>
            </div>
            <h3 style="margin:16px 0 10px">Abbonamento</h3>
            <div class="grid-3">
              <div class="field"><label>Stato</label>
                <select x-model="modal.data.subscription_status">
                  <option value="trial">In prova</option>
                  <option value="active">Attivo</option>
                  <option value="suspended">Sospeso</option>
                  <option value="expired">Scaduto</option>
                </select>
              </div>
              <div class="field"><label>Piano</label>
                <input type="text" x-model="modal.data.plan_name"></div>
              <div class="field"><label>Quota mensile (0 = illimitata)</label>
                <input type="number" min="0" x-model.number="modal.data.monthly_quota"></div>
            </div>
            <div class="field"><label>Scadenza</label>
              <input type="date" x-model="modal.data.subscription_until_day">
              <p class="hint">Vuoto = nessuna scadenza. Passata la data la pubblicazione si blocca da sola.</p>
            </div>

            <h3 style="margin:16px 0 10px">Anagrafica</h3>
            <div class="grid-2">
              <div class="field"><label>Ragione sociale</label>
                <input type="text" x-model="modal.data.legal_name"></div>
              <div class="field"><label>Partita IVA</label>
                <input type="text" class="mono" x-model="modal.data.vat_number"></div>
            </div>
            <div class="grid-3">
              <div class="field"><label>Email</label>
                <input type="email" x-model="modal.data.contact_email"></div>
              <div class="field"><label>PEC</label>
                <input type="email" x-model="modal.data.pec"></div>
              <div class="field"><label>Telefono</label>
                <input type="text" x-model="modal.data.phone"></div>
            </div>
            <div class="grid-3">
              <div class="field"><label>Indirizzo</label>
                <input type="text" x-model="modal.data.address"></div>
              <div class="field"><label>Comune</label>
                <input type="text" x-model="modal.data.city"></div>
              <div class="field"><label>Provincia</label>
                <input type="text" class="mono" x-model="modal.data.province" maxlength="4"></div>
            </div>

            <div class="field"><label>Note interne</label>
              <textarea x-model="modal.data.notes" style="font-family:var(--sans);min-height:60px"></textarea></div>
            <label style="display:flex;gap:8px;align-items:center;font-weight:500">
              <input type="checkbox" x-model="modal.data.is_active" style="width:auto"> Account attivo
            </label>
          </div>
        </template>

        <!-- sito -->
        <template x-if="modal.kind==='site'">
          <div>
            <div class="grid-2">
              <div class="field"><label>Cliente</label>
                <select x-model.number="modal.data.client_id">
                  <template x-for="c in clients" :key="c.id">
                    <option :value="c.id" :selected="c.id == modal.data.client_id" x-text="c.name"></option>
                  </template>
                </select>
              </div>
              <div class="field"><label>Nome del sito</label>
                <input type="text" x-model="modal.data.name"></div>
            </div>
            <div class="field"><label>Indirizzo del sito</label>
              <input type="text" class="mono" x-model="modal.data.base_url" placeholder="https://www.esempio.it">
              <p class="hint">Senza slash finale. Serve HTTPS e i permalink attivi.</p>
            </div>

            <h3 style="margin:16px 0 8px">Chiavi API di WooCommerce</h3>
            <p class="hint" style="margin-top:-4px;margin-bottom:10px">
              Si generano sul sito in <strong>WooCommerce → Impostazioni → Avanzate → API REST →
              Aggiungi chiave</strong>, con permesso <strong>Lettura/Scrittura</strong>.
              Il segreto si vede una volta sola: copialo subito.
              <strong>Queste chiavi restano solo qui: il cliente non le vede da nessuna parte.</strong>
            </p>
            <div class="grid-2">
              <div class="field"><label>Consumer key</label>
                <input type="text" class="mono" x-model="modal.data.wc_key"
                       :placeholder="modal.data.wc_key_masked || 'ck_...'">
                <p class="hint">Lasciala vuota per non cambiarla.</p>
              </div>
              <div class="field"><label>Consumer secret</label>
                <input type="text" class="mono" x-model="modal.data.wc_secret"
                       :placeholder="modal.data.wc_secret_masked || 'cs_...'">
                <p class="hint">Lascialo vuoto per non cambiarlo.</p>
              </div>
            </div>
            <div class="grid-2">
              <div class="field"><label>Stato predefinito dei prodotti</label>
                <select x-model="modal.data.default_status">
                  <option value="publish">Pubblicato</option><option value="draft">Bozza</option>
                </select>
              </div>
              <div class="field"><label>Lingua delle schede di questo negozio</label>
                <select x-model="modal.data.content_lang">
                  <option value="">Quella scelta da chi carica i codici</option>
                  <!-- option scritte qui: generate con x-for arrivano dopo x-model e la select mostra la prima -->
                  <option value="IT" translate="no">Italiano</option><option value="EN" translate="no">English</option><option value="FR" translate="no">Français</option><option value="DE" translate="no">Deutsch</option><option value="ES" translate="no">Español</option>
                </select>
                <p class="hint">Se il negozio è in una lingua sola, fissala qui: le schede arrivano sempre in quella.</p>
              </div>
            </div>
            <h3 style="margin:16px 0 8px">Cosa può sovrascrivere l'importazione</h3>
            <template x-for="f in policyFields" :key="f.key">
              <div class="row" style="margin-bottom:6px">
                <div style="width:190px" x-text="f.label"></div>
                <select style="max-width:220px" x-model="modal.data.write_policy[f.key]">
                  <option value="fill">Solo se vuoto</option>
                  <option value="overwrite">Sempre</option>
                  <option value="skip">Mai</option>
                </select>
              </div>
            </template>
            <label style="display:flex;gap:8px;align-items:center;font-weight:500;margin:16px 0 6px">
              <input type="checkbox" x-model="modal.data.specs_meta" style="width:auto">
              Scrivi le specifiche anche per TD Product Specs
            </label>
            <p class="hint" style="margin-top:-2px">
              Riempie il meta <code>_td_product_specs</code> letto dallo shortcode
              <code>[td_specifiche]</code> e dai campi YOOtheme. Se il plugin non c'è sul sito,
              il meta resta lì senza fare niente.
            </p>

            <div class="field" style="max-width:260px;margin-top:14px">
              <label>Quante specifiche scrivere</label>
              <input type="number" min="0" max="80" x-model.number="modal.data.specs_limit">
              <p class="hint">
                Certe schede ne hanno anche novanta. Le prime sono quelle che contano, il resto
                allunga la scheda e basta. 0 = tutte.
              </p>
            </div>

            <h3 style="margin:18px 0 8px">Immagini, per l'eliminazione</h3>
            <p class="hint" style="margin-top:-4px;margin-bottom:10px">
              Facoltative. Le chiavi WooCommerce eliminano i prodotti ma non le immagini:
              la libreria media è del core WordPress e le chiavi di Woo lì non valgono.
              Con utente e <strong>Password per applicazioni</strong> (Utenti → Profilo →
              Password per applicazioni) si eliminano anche quelle. Senza, i prodotti si
              cancellano lo stesso e le immagini restano in libreria.
            </p>
            <div class="grid-2">
              <div class="field"><label>Utente WordPress</label>
                <input type="text" class="mono" x-model="modal.data.wp_user"></div>
              <div class="field"><label>Password per applicazioni</label>
                <input type="text" class="mono" x-model="modal.data.wp_app_password"
                       :placeholder="modal.data.wp_app_masked || 'xxxx xxxx xxxx xxxx'">
                <p class="hint">Vuota per non cambiarla.</p>
              </div>
            </div>

            <h3 style="margin:18px 0 8px">Campi obbligatori per pubblicare</h3>
            <p class="hint" style="margin-top:-4px;margin-bottom:10px">
              Se manca uno di questi la scheda resta "Da completare" e non parte verso il sito.
            </p>
            <div class="row" style="margin-bottom:14px">
              <template x-for="f in qualityFields" :key="f[0]">
                <button type="button" class="ghost sm"
                        :style="isRequired(f[0]) ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : ''"
                        @click="toggleRequired(f[0])" x-text="f[1]"></button>
              </template>
            </div>

            <h3 style="margin:18px 0 10px">Aggiornamento notturno</h3>
            <label style="display:flex;gap:8px;align-items:center;font-weight:500;margin-bottom:10px">
              <input type="checkbox" x-model="modal.data.resync_enabled" style="width:auto">
              Ricerca di nuovo i prodotti già a catalogo
            </label>

            <template x-if="modal.data.resync_enabled">
              <div>
                <div class="grid-3">
                  <div class="field"><label>Ora</label>
                    <select x-model.number="modal.data.resync_hour">
                      <template x-for="h in 24" :key="h">
                        <option :value="h-1" :selected="(h-1) == modal.data.resync_hour" x-text="String(h-1).padStart(2,'0') + ':00'"></option>
                      </template>
                    </select>
                  </div>
                  <div class="field"><label>Minuti</label>
                    <input type="number" min="0" max="59" x-model.number="modal.data.resync_minute"></div>
                  <div class="field"><label>Quanti per volta</label>
                    <input type="number" min="1" max="2000" x-model.number="modal.data.resync_batch"></div>
                </div>

                <div class="field">
                  <label>Giorni</label>
                  <div class="row">
                    <template x-for="(d, i) in ['Lun','Mar','Mer','Gio','Ven','Sab','Dom']" :key="i">
                      <button type="button" class="ghost sm"
                              :class="isResyncDay(i) && 'on'"
                              :style="isResyncDay(i) ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : ''"
                              @click="toggleResyncDay(i)" x-text="d"></button>
                    </template>
                  </div>
                  <p class="hint" x-text="modal.data.resync_days ? '' : 'Nessun giorno selezionato = tutte le notti.'"></p>
                </div>

                <div class="grid-2">
                  <div class="field"><label>Quali prodotti</label>
                    <select x-model="modal.data.resync_scope">
                      <option value="hub">Solo quelli importati da qui</option>
                      <option value="all">Tutti quelli con un EAN sul sito</option>
                    </select>
                  </div>
                  <div class="field"><label>Salta quelli aggiornati da meno di</label>
                    <input type="number" min="0" max="365" x-model.number="modal.data.resync_min_age_days">
                    <p class="hint">giorni</p>
                  </div>
                </div>

                <h3 style="margin:14px 0 8px">Cosa aggiorna la notte</h3>
                <p class="hint" style="margin-top:-4px;margin-bottom:10px">
                  Regole a parte rispetto all'importazione manuale. Il nome di norma non si tocca:
                  se il cliente l'ha sistemato a mano, riscriverlo di notte se ne accorge la mattina.
                </p>
                <template x-for="f in policyFields" :key="'r-' + f.key">
                  <div class="row" style="margin-bottom:6px">
                    <div style="width:190px" x-text="f.label"></div>
                    <select style="max-width:220px" x-model="modal.data.resync_policy[f.key]">
                      <option value="fill">Solo se vuoto</option>
                      <option value="overwrite">Sempre</option>
                      <option value="skip">Mai</option>
                    </select>
                  </div>
                </template>

                <template x-if="modal.data.last_resync_msg">
                  <p class="hint" style="margin-top:12px">
                    Ultimo giro: <span x-text="fmtDate(modal.data.last_resync_at)"></span> —
                    <span x-text="modal.data.last_resync_msg"></span>
                  </p>
                </template>
              </div>
            </template>


          </div>
        </template>

        <!-- eliminazione importazione -->
        <template x-if="modal.kind==='purge'">
          <div>
            <template x-if="modal.data.da_eliminare > 0">
              <div class="notice n-err" style="margin-top:0">
                Stai per eliminare <strong x-text="modal.data.da_eliminare"></strong>
                prodotti dal sito <strong x-text="modal.data.site_name"></strong>.
                Non si torna indietro.
              </div>
            </template>

            <dl class="kv">
              <dt>Creati da questa importazione</dt>
              <dd><strong x-text="modal.data.da_eliminare"></strong> prodotti, eliminabili</dd>
              <dt>Solo aggiornati</dt>
              <dd>
                <span x-text="modal.data.aggiornati"></span> prodotti, <strong>non si toccano</strong>
                <div class="hint">Erano già sul sito prima di questa importazione.</div>
              </dd>
              <dt>Immagini</dt>
              <dd>
                <template x-if="modal.data.immagini">
                  <span>vengono eliminate insieme ai prodotti</span>
                </template>
                <template x-if="!modal.data.immagini">
                  <span>restano nella libreria media
                    <div class="hint">Per eliminarle servono utente e Password per applicazioni
                    nella scheda del sito.</div>
                  </span>
                </template>
              </dd>
            </dl>

            <div class="row" style="margin-top:16px;gap:10px">
              <button class="danger" x-show="modal.data.da_eliminare > 0" @click="doPurge(true)"
                      x-text="'Elimina anche i ' + modal.data.da_eliminare + ' prodotti dal sito'"></button>
              <button class="ghost" @click="doPurge(false)">Elimina solo dal portale</button>
            </div>
            <p class="hint" style="margin-top:10px">
              «Solo dal portale» cancella lo storico dell'importazione e lascia il sito com'è.
            </p>
          </div>
        </template>

        <!-- eliminazione di una categoria -->
        <template x-if="modal.kind==='catdel'">
          <div>
            <div class="notice n-err" style="margin-top:0">
              Elimini dal sito la categoria <strong x-text="modal.data.nome" translate="no"></strong>.
              Non si torna indietro.
            </div>
            <dl class="kv">
              <dt>Prodotti dentro</dt>
              <dd>
                <span x-text="modal.data.count"></span>
                <div class="hint">Restano sul sito: quelli che non hanno altre categorie finiscono in «Senza categoria».</div>
              </dd>
              <dt x-show="modal.data.figlie > 0">Sottocategorie</dt>
              <dd x-show="modal.data.figlie > 0">
                <span x-text="modal.data.figlie"></span>
                <div class="hint">Non si eliminano: salgono di un livello.</div>
              </dd>
              <dt>Nel portale</dt>
              <dd>I prodotti che la usavano tornano da completare.</dd>
            </dl>
            <div class="row" style="margin-top:16px;gap:10px">
              <button class="danger" @click="eliminaCategoria()" :disabled="catBusy">Elimina la categoria</button>
              <button class="ghost" @click="modal.kind = null">Annulla</button>
            </div>
          </div>
        </template>

        <!-- fonte dati -->
        <template x-if="modal.kind==='provider'">
          <div>
            <p class="hint" style="margin-top:0" x-text="modal.data.descrizione"></p>

            <div class="grid-2">
              <div class="field"><label>Nome</label>
                <input type="text" x-model="modal.data.name"></div>
              <div class="field"><label>Ordine di prova</label>
                <input type="number" min="0" max="999" x-model.number="modal.data.priority">
                <p class="hint">Numero più basso = provata prima.</p>
              </div>
            </div>

            <template x-if="modal.data.kind === 'http_json'">
              <div>
                <div class="grid-2">
                  <div class="field"><label>Utente del portale</label>
                    <input type="text" class="mono" x-model="modal.data.username"></div>
                  <div class="field"><label>Password o chiave</label>
                    <input type="text" class="mono" x-model="modal.data.secret"
                           :placeholder="modal.data.secret_masked || 'lascia vuoto per non cambiarla'"></div>
                </div>
                <div class="field"><label>Indirizzo delle API</label>
                  <input type="text" class="mono" x-model="modal.data.endpoint"
                         placeholder="https://api.esempio.it/prodotti/{gtin}">
                  <p class="hint">
                    Lo trovi nell'area riservata del portale, sezione API. Metti
                    <code>{gtin}</code> dove va il codice EAN.
                  </p>
                </div>
              </div>
            </template>

            <template x-if="modal.data.kind === 'web'">
              <div>
                <div class="notice n-ok" style="margin-top:0">
                  Non c'è niente da configurare qui: la pagina del produttore la trova da
                  sola col motore di ricerca impostato nel pannello, pagina <strong>Impostazioni</strong>.
                  Funziona anche su marche mai viste prima.
                </div>

                <details style="margin-top:12px">
                  <summary class="hint">Ho già gli indirizzi di certe marche, li voglio usare</summary>
                  <div class="field" style="margin-top:10px">
                    <label>Indirizzi fissi, uno per riga</label>
                <textarea x-model="modal.data.endpoint" rows="6" class="mono"
                          placeholder="https://www.bosch-home.it/ricerca?q={gtin}&#10;https://www.samsung.com/it/search/?searchvalue={gtin}"></textarea>
                <p class="hint">
                  Un indirizzo per marca. Segnaposto: <code>{gtin}</code> per l'EAN,
                  <code>{mpn}</code> per il codice produttore. Vanno bene sia la pagina
                  prodotto diretta, se conosci lo schema degli indirizzi, sia la ricerca
                  interna del sito.
                </p>
                    <p class="hint">
                      Se metti qualcosa qui, si usano solo questi e la ricerca automatica
                      viene saltata. Segnaposto: <code>{gtin}</code> e <code>{mpn}</code>.
                    </p>
                  </div>
                </details>

                <div class="notice n-warn" style="margin-top:12px">
                  In entrambi i casi si rispetta il file <code>robots.txt</code> di ogni sito, si
                  aspetta un secondo e mezzo fra una pagina e l'altra e i siti protetti da verifiche
                  anti-bot si saltano. Se la pagina non conferma il codice richiesto, la scheda viene
                  scartata invece di importare il prodotto sbagliato.
                </div>
              </div>
            </template>

            <template x-if="modal.data.kind === 'http_json'">
              <details style="margin-top:10px">
                <summary class="hint">Impostazioni avanzate</summary>
                <div class="grid-2" style="margin-top:10px">
                  <div class="field"><label>Autenticazione</label>
                    <select x-model="modal.data.auth_mode">
                      <option value="none">Nessuna</option>
                      <option value="basic">Utente e password</option>
                      <option value="header">Intestazione HTTP</option>
                      <option value="query">Parametro nell'indirizzo</option>
                      <option value="bearer">Bearer token</option>
                    </select>
                  </div>
                  <div class="field"><label>Nome intestazione o parametro</label>
                    <input type="text" class="mono" x-model="modal.data.auth_name" placeholder="X-Api-Key"></div>
                </div>
                <div class="field"><label>Dove inizia la scheda nella risposta</label>
                  <input type="text" class="mono" x-model="modal.data.root_path" placeholder="dati.articolo"></div>
                <div class="field"><label>Mappa dei campi</label>
                  <textarea x-model="modal.data.field_map_text" rows="10" class="mono"></textarea>
                  <p class="hint">
                    A sinistra il campo del portale, a destra dove trovarlo nella risposta.
                    Per le liste usa <code>[]</code>. I prezzi non si mappano: li mette il cliente.
                  </p>
                </div>
              </details>
            </template>

            <div class="row" style="margin-top:14px">
              <input type="text" class="mono" style="max-width:190px" x-model="providerTestGtin"
                     placeholder="EAN di prova">
              <button class="ghost" @click="testProvider()">Prova la fonte</button>
              <div class="grow"></div>
              <button class="danger" x-show="modal.data.id" @click="deleteProvider()">Disattiva</button>
            </div>

            <template x-if="providerTest">
              <div style="margin-top:12px">
                <div class="notice" :class="providerTest.ok ? 'n-ok' : 'n-err'"
                     x-text="providerTest.ok ? 'La fonte risponde e i campi sono stati riconosciuti.' : (providerTest.error || 'Risposta ricevuta ma senza nome prodotto: controlla le impostazioni.')"></div>
                <template x-if="providerTest.product">
                  <div x-html="renderProduct(providerTest.product)"></div>
                </template>
                <template x-if="providerTest.raw_sample">
                  <details style="margin-top:10px">
                    <summary class="hint">Risposta grezza, per capire dove stanno i campi</summary>
                    <pre class="mono" style="white-space:pre-wrap;font-size:11.5px;max-height:240px;overflow:auto"
                         x-text="providerTest.raw_sample"></pre>
                  </details>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- utente -->
        <template x-if="modal.kind==='user'">
          <div>
            <div class="field"><label>Email</label>
              <input type="email" x-model="modal.data.email" placeholder="nome@dominio.it"
                     autocomplete="off" spellcheck="false"></div>
            <div class="field"><label>Nome e cognome</label>
              <input type="text" x-model="modal.data.full_name"></div>

            <div class="field">
              <label x-text="modal.data.id ? 'Nuova password' : 'Password'"></label>
              <div class="row" style="flex-wrap:nowrap">
                <input type="text" class="mono" x-model="modal.data.password"
                       autocomplete="new-password" spellcheck="false"
                       :placeholder="modal.data.id ? 'lasciala vuota per non cambiarla' : 'vuota = generata dal portale'">
                <button type="button" class="ghost sm" @click="generaPassword()">Genera</button>
              </div>
              <p class="hint">Almeno 10 caratteri. La vedi solo tu: mandala al cliente come preferisci.</p>
            </div>
            <div class="grid-2">
              <div class="field"><label>Ruolo</label>
                <select x-model="modal.data.role">
                  <option value="client">Cliente</option><option value="admin">Amministratore</option>
                </select>
              </div>
              <div class="field"><label>Cliente collegato</label>
                <select x-model.number="modal.data.client_id">
                  <option value="">Nessuno</option>
                  <template x-for="c in clients" :key="c.id">
                    <option :value="c.id" :selected="c.id == modal.data.client_id" x-text="c.name"></option>
                  </template>
                </select>
              </div>
            </div>
            <label style="display:flex;gap:8px;align-items:center;font-weight:500">
              <input type="checkbox" x-model="modal.data.is_active" style="width:auto"> Può accedere
            </label>
            <template x-if="modal.data.generated_password">
              <div class="notice n-ok" style="margin-top:14px">
                Password generata, mandagliela tu: <code x-text="modal.data.generated_password"></code>
              </div>
            </template>
          </div>
        </template>

      </div>
      <footer x-show="modal.kind !== 'preview' && modal.kind !== 'purge' && modal.kind !== 'perche' && modal.kind !== 'catdel'">
        <button class="ghost" @click="modal.kind=null">Annulla</button>
        <button @click="saveModal()">Salva</button>
      </footer>
    </div>
  </div>
</template>

<script src="/static/hub.js?v={{ static_v }}"></script>
</body>
</html>
