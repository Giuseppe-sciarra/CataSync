<!doctype html>
<html lang="it" data-project="catasync">
<head>
<meta charset="utf-8">
  <script src="/static/i18n/catalog.js?v={{ static_v }}"></script>
  <script src="/static/i18n/i18n.js?v={{ static_v }}"></script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>{{ app_name }}</title>
{% if portal_favicon %}
<link rel="icon" href="{{ portal_favicon }}" type="{{ portal_favicon_type }}">
{% if portal_favicon_raster %}<link rel="apple-touch-icon" href="{{ portal_favicon }}">{% endif %}
{% else %}
<link rel="icon" href="/static/favicon.svg?v={{ static_v }}" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png?v={{ static_v }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ static_v }}">
{% endif %}
<script>
/* Applica il tema prima del disegno, altrimenti si vede il lampo bianco. */
(function () {
  try {
    var t = localStorage.getItem('tdic-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
<script defer src="/static/alpine.min.js?v={{ static_v }}"></script>

  <link rel="stylesheet" href="/static/i18n/i18n.css?v={{ static_v }}">
</head>
<body x-data="hub({{ 'true' if is_admin else 'false' }})" x-init="boot()">

<header class="topbar">
  <div class="brand">
    {% if portal_logo %}<img src="{{ portal_logo }}" alt="{{ app_name }}" class="brand-logo">
    {% else %}{{ app_name }}{% endif %}
  </div>
  <template x-if="brand && (brand.logo || brand.name)">
    <div class="client-badge">
      <template x-if="brand.logo"><img :src="brand.logo" alt=""></template>
      <span x-text="brand.name"></span>
    </div>
  </template>
  <nav>
    <template x-if="!isAdmin">
      <button :class="(tab==='catalogo' || tab==='single') && 'on'" @click="go('catalogo')">Prodotti</button>
    </template>
    <template x-if="!isAdmin">
      <button :class="tab==='jobs' && 'on'" @click="go('jobs')">Storico</button>
    </template>
    <template x-if="!isAdmin">
      <button :class="tab==='categories' && 'on'" @click="go('categories')">Categorie</button>
    </template>
    <template x-if="!isAdmin"><button :class="tab==='shop' && 'on'" @click="go('shop')">Negozio</button></template>
    <button :class="tab==='guida' && 'on'" @click="go('guida')">Guida</button>
    <template x-if="isAdmin">
      <span style="display:contents">
        <button :class="tab==='clients' && 'on'" @click="go('clients')">Clienti</button>
        <button :class="tab==='sites' && 'on'" @click="go('sites')">Siti</button>
        <button :class="tab==='users' && 'on'" @click="go('users')">Utenti</button>
        <button :class="tab==='impostazioni' && 'on'" @click="go('impostazioni')">Impostazioni</button>
      </span>
    </template>
  </nav>
  <div class="spacer"></div>
  <div class="who">{{ user_email }}</div>
  <button class="theme-btn" @click="cycleTheme()" :title="themeTitle()" :aria-label="themeTitle()">
    <span x-show="theme==='auto'" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 010 16" fill="currentColor" stroke="none"/></svg>
    </span>
    <span x-show="theme==='light'" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </span>
    <span x-show="theme==='dark'" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
    </span>
  </button>
  <button class="ghost sm esci" @click="logout()">Esci</button>
</header>

<main class="wrap stack" x-cloak>

  <template x-if="flash.msg">
    <div class="notice" :class="'n-' + flash.kind" x-text="flash.msg"></div>
  </template>

  <template x-if="sub && !isAdmin">
    <div class="stack" style="gap:10px">
      <template x-if="!sub.allowed">
        <div class="notice n-err" style="margin:0">
          <strong x-text="sub.status_label"></strong> — <span x-text="sub.reason"></span>
        </div>
      </template>
      <div class="sub-bar">
        <span class="badge" :class="sub.allowed ? 'b-ok' : 'b-err'" x-text="sub.status_label"></span>
        <span x-text="sub.plan"></span>
        <template x-if="sub.expires_at">
          <span class="hint" x-text="'fino al ' + fmtDay(sub.expires_at)"></span>
        </template>
        <template x-if="sub.quota">
          <span class="hint num" x-text="sub.used + ' / ' + sub.quota + ' prodotti questo mese'"></span>
        </template>
        <template x-if="sub.quota">
          <span class="meter"><i :class="sub.remaining === 0 && 'full'"
                :style="'width:' + Math.min(100, Math.round(sub.used * 100 / sub.quota)) + '%'"></i></span>
        </template>
        <template x-if="!sub.quota">
          <span class="hint num" x-text="sub.used + ' prodotti pubblicati questo mese'"></span>
        </template>
      </div>
    </div>
  </template>

  <!-- ============================================================ IMPORTA -->
  <!-- ========================================================== CATALOGO -->
  <template x-if="tab==='catalogo'">
    <div class="stack">
      <template x-if="!sites.length">
        <div class="card"><div class="empty">
          <p>Nessun sito collegato al tuo account.</p>
          <p class="hint">Il collegamento lo attiva l'amministratore del portale.</p>
        </div></div>
      </template>

      <template x-if="sites.length">
        <div class="stack">

          <!-- ================= 1. AGGIUNGI PRODOTTI: sempre in cima, sempre aperto -->
          <div class="card aggiungi">
            <header>
              <h2>Aggiungi prodotti</h2>
              <template x-if="sites.length > 1">
                <select style="max-width:260px; margin-left:8px" x-model.number="form.site_id" @change="onSiteChange(); loadCatalogo()">
                  <template x-for="s in sites" :key="'as'+s.id">
                    <option :value="s.id" :selected="s.id == form.site_id" x-text="s.name"></option>
                  </template>
                </select>
              </template>
              <div class="grow"></div>
              <button class="ghost sm" @click="apriGuida('import')">📖 Guida</button>
              <button class="ghost sm" @click="go('single')">Prova un solo codice</button>
            </header>
            <div class="body">
              <div class="aggiungi-grid">
                <div class="field" style="margin:0">
                  <label for="eans">Incolla i codici, uno per riga: EAN oppure codice produttore</label>
                  <textarea id="eans" x-ref="eans" x-model="form.eans" rows="4"
                    placeholder="8059893356383&#10;97924465&#10;FAST 14 FI"></textarea>
                  <div class="row" style="margin-top:8px">
                    <span class="hint" :class="eanCount && 'ok-hint'"
                          x-text="eanCount ? riepilogoCodici : 'EAN: le cifre sotto il codice a barre. Codice produttore: quello della marca che trovi sulla fattura del grossista (es. 97924465). Non il tuo codice di magazzino.'"></span>
                    <div class="grow"></div>
                    <label class="btn ghost sm" style="margin:0; cursor:pointer">
                      Carica un CSV
                      <input type="file" accept=".csv,text/csv" style="display:none" @change="uploadCsv($event)">
                    </label>
                  </div>
                </div>
                <div class="aggiungi-azione">
                  <button class="grande" @click="createJob()" :disabled="busy || !eanCount"
                          x-text="busy ? 'Un attimo…' : (eanCount ? ('Cerca le schede di ' + eanCount + ' prodotti') : 'Cerca le schede')"></button>
                  <div class="lingua-schede">
                    <label for="lang">Schede in</label>
                    <template x-if="!linguaFissata">
                      <select id="lang" x-model="form.lang" @change="linguaScelta = true" translate="no">
                        <!-- option scritte qui: generate con x-for arrivano dopo x-model e la select mostra la prima -->
                        <option value="IT" translate="no">Italiano</option><option value="EN" translate="no">English</option><option value="FR" translate="no">Français</option><option value="DE" translate="no">Deutsch</option><option value="ES" translate="no">Español</option>
                      </select>
                    </template>
                    <template x-if="linguaFissata">
                      <span class="lingua-fissa"><strong translate="no" x-text="nomeLingua(linguaFissata)"></strong>
                        <span class="hint">· impostata sul negozio</span></span>
                    </template>
                  </div>
                  <p class="hint" style="margin-top:8px">
                    Le schede compaiono qui sotto man mano. Poi metti categoria e prezzo in tabella e pubblichi.
                    I codici già sul sito vengono aggiornati, non duplicati.
                    Col codice produttore, se la pagina trovata riporta l'EAN, lo recuperiamo noi.
                    Quello che trovo in un'altra lingua lo traduco nella lingua delle schede.
                  </p>
                  <details class="opzioni">
                    <summary>Opzioni</summary>
                    <div class="grid-2" style="margin-top:10px">
                      <div class="field">
                        <label for="label">Nome del carico</label>
                        <input id="label" type="text" x-model="form.label" placeholder="lasciato vuoto: la data di oggi">
                      </div>
                      <div class="field">
                        <label for="pstatus">Stato dei prodotti creati</label>
                        <select id="pstatus" x-model="form.product_status">
                          <option value="publish">Pubblicato</option>
                          <option value="draft">Bozza</option>
                        </select>
                      </div>
                    </div>
                  </details>
                </div>
              </div>
            </div>
          </div>

          <!-- ================= primo accesso: un invito alla Guida, che si chiude e resta chiuso -->
          <template x-if="guidaAperta('benvenuto')">
            <div class="notice n-ok benvenuto">
              <span>Prima volta qui? La Guida spiega in quattro passi come si caricano i prodotti, con esempi.</span>
              <span class="row" style="gap:8px">
                <button class="sm" @click="apriGuida('import')">Apri la guida</button>
                <button class="ghost sm" @click="ricordaGuida('benvenuto', false)">Ho capito, nascondi</button>
              </span>
            </div>
          </template>

          <!-- ================= 2. banner dell'importazione in corso / appena finita -->
          <template x-if="ultimoJob">
            <div class="banner" :class="ultimoJobFinito ? 'b-ok' : 'b-run'">
              <template x-if="!ultimoJobFinito">
                <div class="row" style="gap:12px">
                  <span class="spin"></span>
                  <div>
                    <strong x-text="'Sto cercando le schede di ' + ultimoJob.total + ' prodotti…'"></strong>
                    <div class="hint" x-text="riepilogoRicerca(ultimoJob)"></div>
                  </div>
                </div>
              </template>
              <template x-if="ultimoJobFinito">
                <div class="row" style="gap:12px; flex-wrap:wrap">
                  <div class="grow">
                    <strong>Ricerca finita.</strong>
                    <span x-text="riepilogoFinale(ultimoJob)"></span>
                  </div>
                  <button class="ghost sm" @click="ultimoJob=null">Ok, chiudi</button>
                </div>
              </template>
            </div>
          </template>

          <div class="card">
            <header class="cat-head">
              <div>
                <h2>I tuoi prodotti</h2>
                <div class="hint" x-text="etichettaVista()"></div>
              </div>
              <select class="vista" x-model="catalogo.vista" @change="catalogo.filtro=null; catalogo.sel={}">
                <option value="ultimo">Ultimo carico</option>
                <template x-if="catalogo.caricoScelto">
                  <option value="carico" x-text="'Carico: ' + catalogo.caricoScelto.label"></option>
                </template>
                <option value="da_fare">Da sistemare (tutti i carichi)</option>
                <option value="tutti">Tutti i prodotti</option>
              </select>
              <button class="ghost sm" @click="apriGuida('import')" title="Come si caricano i prodotti, con esempi">📖 Guida</button>
              <div class="grow"></div>
              <button class="ghost" x-show="catalogo.da_arricchire" @click="riprovaSchedeIncomplete()"
                      x-text="'Riprova schede incomplete' + (catalogo.da_arricchire ? ' (' + catalogo.da_arricchire + ')' : '')"></button>
              <button class="ok" @click="pubblicaTutto()" :disabled="!(catalogo.conteggi.pronto||0) || (sub && !sub.allowed)"
                      x-text="'Pubblica sul sito' + ((catalogo.conteggi.pronto||0) ? ' (' + catalogo.conteggi.pronto + ')' : '')"></button>
            </header>

            <!-- contatori-filtro -->
            <div class="kpis">
              <template x-for="k in kpiStati" :key="k.key">
                <button class="kpi" :class="[catalogo.filtro===k.key ? 'on' : '', 'k-'+k.key]"
                        @click="catalogo.filtro = (catalogo.filtro===k.key ? null : k.key)">
                  <span class="kpi-n" x-text="conteggiVista[k.key] || 0"></span>
                  <span class="kpi-l" x-text="k.label"></span>
                </button>
              </template>
              <div class="grow"></div>
              <input type="search" class="cerca" placeholder="Cerca per nome, marca o EAN" x-model="catalogo.cerca">
            </div>

            <!-- barra azioni sulla selezione -->
            <template x-if="numSel > 0">
              <div class="selbar">
                <strong x-text="numSel + ' selezionati'"></strong>
                <select style="max-width:260px" x-model.number="bulk.category_id">
                  <option value="">— categoria da assegnare —</option>
                  <template x-for="c in catValide" :key="'bk'+c.id">
                    <option :value="c.id" :selected="c.id == bulk.category_id" x-text="c.name"></option>
                  </template>
                </select>
                <button class="sm" @click="applicaBulk('categoria')" :disabled="!bulk.category_id">Assegna categoria</button>
                <input type="text" class="mono" style="max-width:120px" placeholder="prezzo" x-model="bulk.regular_price">
                <button class="sm" @click="applicaBulk('prezzo')" :disabled="!bulk.regular_price">Imposta prezzo</button>
                <div class="grow"></div>
                <button class="danger sm" x-show="numEliminabiliSel > 0" @click="eliminaSelezionati()"
                        x-text="'Elimina selezionati (' + numEliminabiliSel + ')'">Elimina selezionati</button>
                <button class="ghost sm" @click="catalogo.sel = {}">Annulla selezione</button>
              </div>
            </template>

            <div class="body tight">
              <template x-if="catalogo.busy && !catalogo.righe.length">
                <div class="empty"><p>Carico il catalogo…</p></div>
              </template>
              <template x-if="!catalogo.busy && !catalogo.righe.length">
                <div class="empty">
                  <p>Ancora nessun prodotto su questo sito.</p>
                  <p class="hint">Incolla i codici EAN nel riquadro qui sopra e premi «Cerca le schede».</p>
                </div>
              </template>

              <template x-if="righeFiltrate.length">
                <table class="tab-cat">
                  <thead><tr>
                    <th style="width:36px"><input type="checkbox" @change="selTutti($event.target.checked)" :checked="tuttiSel"></th>
                    <th style="width:56px"></th>
                    <th class="col-prodotto">Prodotto</th>
                    <th style="width:270px">Categoria sul sito</th>
                    <th style="width:290px">Prezzi</th>
                    <th class="col-stato" style="width:290px">Stato</th>
                    <th style="width:380px"></th>
                  </tr></thead>
                  <tbody>
                    <template x-for="r in righeFiltrate" :key="'r'+r.item_id">
                      <tr :class="r.stato">
                        <td><input type="checkbox" :checked="!!catalogo.sel[r.item_id]" @change="catalogo.sel[r.item_id] = $event.target.checked" :disabled="r.stato==='in_corso'"></td>
                        <td>
                          <template x-if="r.image"><img class="thumb" :src="r.image" alt=""></template>
                          <template x-if="!r.image"><div class="thumb vuoto"></div></template>
                        </td>
                        <td>
                          <div class="titolo" x-text="r.title || (r.stato === 'in_corso' ? 'Scheda in arrivo…' : 'Scheda non trovata')"></div>
                          <div class="hint">
                            <span x-text="r.brand"></span><span x-show="r.brand"> · </span>
                            <span x-show="r.tipo_codice==='mpn'">cod. </span><span class="gtin" x-text="r.gtin"></span>
                            <template x-if="r.ean_recuperato"><span> · EAN <span class="gtin" x-text="r.ean_recuperato"></span></span></template>
                          </div>
                          <div class="hint fonte-riga" x-show="r.source" x-text="tt('fonte: {0}', t(r.source))"></div>
                          <div class="hint avviso" x-show="r.gia_sul_sito">già sul sito: verrà aggiornato</div>
                          <div class="hint avviso" x-show="r.conferma==='debole'">⚠ trovato per somiglianza del nome: controlla che sia lui</div>
                          <template x-if="r.riprova_alle">
                            <div class="hint avviso" x-text="'Motori di ricerca bloccati: riprovo da solo alle ' + fmtOra(r.riprova_alle)"></div>
                          </template>
                          <template x-if="r.perche && r.perche.causa && (r.stato==='non_trovato' || r.stato==='problema')">
                            <div class="hint perche-breve" x-text="causaBreve(r.perche.causa)"></div>
                          </template>
                        </td>
                        <td>
                          <template x-if="r.stato!=='in_corso'">
                            <select x-model.number="r.category_id" :class="!r.category_id && 'manca'" @change="salvaRiga(r)">
                              <option value="" disabled>— scegli —</option>
                              <template x-for="c in catValide" :key="'rc'+r.item_id+'-'+c.id">
                                <option :value="c.id" :selected="c.id == r.category_id" x-text="c.name"></option>
                              </template>
                            </select>
                          </template>
                        </td>
                        <td>
                          <template x-if="r.stato!=='in_corso'">
                            <div class="price-stack">
                              <input type="text" class="mono" :class="!r.regular_price && 'manca'" x-model="r.regular_price"
                                     placeholder="Prezzo" @change="salvaRiga(r)" @keydown.enter="$event.target.blur()">
                              <input type="text" class="mono sale" x-model="r.sale_price" placeholder="Scontato —"
                                     @change="salvaRiga(r)" @keydown.enter="$event.target.blur()">
                            </div>
                          </template>
                        </td>
                        <td class="col-stato">
                          <span class="pill" :class="'p-'+r.stato" x-text="statoLabel(r)"></span>
                          <div class="hint" x-show="catalogo.salvando[r.item_id]"
                               x-text="catalogo.salvando[r.item_id] === true ? 'salvo…' : catalogo.salvando[r.item_id]"></div>
                        </td>
                        <td class="right azioni">
                          <template x-if="r.stato==='pronto'">
                            <button class="ok sm" @click="pubblicaRiga(r)" :disabled="!!catalogo.salvando[r.item_id] || (sub && !sub.allowed)"
                                    :title="sub && !sub.allowed ? sub.reason : 'Manda sul sito solo questo prodotto'">Pubblica</button>
                          </template>
                          <template x-if="r.ha_diagnosi && (r.stato==='non_trovato' || r.stato==='problema' || r.riprova_alle)">
                            <button class="ghost sm" @click="apriPerche(r.item_id, r.title || r.gtin)" title="Cosa è successo cercando questo codice">Perché?</button>
                          </template>
                          <template x-if="r.stato==='non_trovato'">
                            <button class="sm warn" @click="editItem(r.item_id)">Compila a mano</button>
                          </template>
                          <template x-if="r.stato==='problema'">
                            <button class="sm" @click="riprovaRiga(r)">Riprova</button>
                          </template>
                          <template x-if="r.stato==='da_completare' && r.missing_source && r.missing_source.length">
                            <button class="sm warn" @click="riprovaRiga(r)">Riprova dati</button>
                          </template>
                          <template x-if="r.url_sito && (r.stato==='sul_sito' || r.gia_sul_sito)">
                            <a class="btn ghost sm" :href="r.url_sito" target="_blank" rel="noopener">Vedi sul sito</a>
                          </template>
                          <template x-if="r.title && r.stato!=='non_trovato'">
                            <button class="ghost sm" @click="editItem(r.item_id)">Modifica</button>
                          </template>
                          <template x-if="r.can_delete">
                            <button class="danger sm" @click="eliminaRiga(r)">Elimina</button>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
              <template x-if="catalogo.righe.length && !righeFiltrate.length">
                <div class="empty"><p>Nessun prodotto con questo filtro.</p></div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- ====================================================== PROVA UN EAN -->
  <template x-if="tab==='single'">
    <div class="card">
      <header>
        <h2>Prova un codice</h2>
        <div class="grow"></div>
        <button class="ghost sm" @click="go('catalogo')">Torna ai prodotti</button>
      </header>
      <div class="body">
        <div class="row" style="margin-bottom:14px">
          <input type="text" class="mono" style="max-width:260px" x-model="single.gtin"
                 placeholder="EAN o codice produttore" @keydown.enter="testEan()">
          <template x-if="!linguaFissata">
            <select style="max-width:160px" x-model="form.lang" @change="linguaScelta = true" translate="no">
              <!-- option scritte qui: generate con x-for arrivano dopo x-model e la select mostra la prima -->
              <option value="IT" translate="no">Italiano</option><option value="EN" translate="no">English</option><option value="FR" translate="no">Français</option><option value="DE" translate="no">Deutsch</option><option value="ES" translate="no">Español</option>
            </select>
          </template>
          <button @click="testEan()" :disabled="single.busy">
            <span x-text="single.busy ? 'Interrogo le fonti…' : 'Cerca'"></span>
          </button>
        </div>

        <template x-if="single.message">
          <div class="notice n-warn">
            <div x-text="single.diagnosi && single.diagnosi.causa ? causaTesto(single.diagnosi.causa) : single.message"></div>
          </div>
        </template>
        <template x-if="single.diagnosi && !single.product">
          <div x-html="renderDiagnosi(single.diagnosi)"></div>
        </template>

        <template x-if="single.product">
          <div class="stack">
            <template x-if="single.onSite && single.onSite.found">
              <div class="notice n-warn">
                Questo codice è già su un prodotto del sito
                (<span x-text="single.onSite.title"></span>). Reimportandolo verrà aggiornato,
                non duplicato.
              </div>
            </template>
            <p class="hint" x-show="single.fonte">
              Scheda trovata da: <strong x-text="single.fonte"></strong></p>
            <div x-html="renderProduct(single.product)"></div>
            <template x-if="single.diagnosi">
              <details class="diario-box">
                <summary class="hint">Come l'ho trovata (siti aperti, motori interrogati)</summary>
                <div x-html="renderDiagnosi(single.diagnosi)"></div>
              </details>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ======================================================= IMPORTAZIONI -->
  <template x-if="tab==='jobs'">
    <div class="stack">
      <template x-if="!(soloJob && job)">
      <div class="card">
        <header>
          <h2>Importazioni</h2>
          <div class="grow"></div>
          <button class="ghost sm" @click="loadJobs()">Aggiorna</button>
        </header>
        <div class="body tight">
          <template x-if="!jobs.length">
            <div class="empty"><p>Ancora nessuna importazione.</p>
              <button class="ghost" @click="go('catalogo')">Caricane una</button></div>
          </template>
          <template x-if="jobs.length">
            <table class="storico">
              <thead><tr>
                <th>Carico</th><th x-show="isAdmin">Sito</th>
                <th style="width:38%" x-text="isAdmin ? 'Avanzamento' : 'Com\'è andata'"></th>
                <th class="right">Prodotti</th><th class="right" x-show="isAdmin">Stato</th><th></th>
              </tr></thead>
              <tbody>
                <template x-for="j in jobs" :key="j.id">
                  <tr>
                    <td>
                      <div class="row" style="gap:6px">
                        <strong x-text="j.label"></strong>
                        <span class="badge b-run" x-show="j.kind === 'resync'">notturno</span>
                      </div>
                      <div class="hint" x-text="fmtDate(j.created_at)"></div>
                    </td>
                    <td x-show="isAdmin" x-text="j.site_name"></td>
                    <td>
                      <!-- admin: barra tecnica; cliente: pill in parole povere -->
                      <template x-if="isAdmin">
                        <div>
                          <div class="barcode" x-html="barcode(j)"></div>
                          <div class="hint" x-text="fase(j) + ' · ' + countsLabel(j)"></div>
                        </div>
                      </template>
                      <template x-if="!isAdmin">
                        <div class="esito-pills">
                          <span class="pill p-sul_sito" x-show="j.counts.pushed" x-text="j.counts.pushed + ' sul sito'"></span>
                          <span class="pill p-pronto" x-show="j.counts.ready" x-text="j.counts.ready + ' pronti'"></span>
                          <span class="pill p-da_completare" x-show="j.counts.incomplete" x-text="j.counts.incomplete + ' da completare'"></span>
                          <span class="pill p-non_trovato" x-show="j.counts.not_found" x-text="j.counts.not_found + ' non trovati'"></span>
                          <span class="pill p-problema" x-show="(j.counts.error||0)+(j.counts.blocked||0)" x-text="((j.counts.error||0)+(j.counts.blocked||0)) + ' problemi'"></span>
                          <span class="pill p-in_corso" x-show="(j.counts.pending||0)+(j.counts.fetching||0)+(j.counts.pushing||0)" x-text="'in lavorazione'"></span>
                        </div>
                      </template>
                    </td>
                    <td class="right num" x-text="j.total"></td>
                    <td class="right" x-show="isAdmin"><span class="badge" :class="jobBadge(j.status)" x-text="jobLabel(j.status)"></span></td>
                    <td class="right azioni">
                      <template x-if="!isAdmin">
                        <span>
                          <button class="sm" @click="mostraCarico(j)">Mostra nei Prodotti</button>
                          <button class="ghost sm" @click="openJob(j.id)" title="Scheda tecnica e revisione guidata una a una">Dettagli</button>
                        </span>
                      </template>
                      <template x-if="isAdmin">
                        <button class="sm" @click="openJob(j.id)">Apri</button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
        </div>
      </div>
      </template>

      <template x-if="job">
        <div class="card" id="job-card">
          <header>
            <h2 x-text="job.label"></h2>
            <span class="badge" :class="jobBadge(job.status)" x-text="jobLabel(job.status)"></span>
            <div class="grow"></div>
            <button x-show="daRivedere > 0 && !review.on" @click="startReview()"
                    x-text="'Rivedi una a una (' + daRivedere + ')'"></button>
            <button class="ok sm" x-show="hasReady" @click="publishJob()"
                    :disabled="sub && !sub.allowed"
                    :title="sub && !sub.allowed ? sub.reason : ''">Pubblica sul sito</button>
            <button class="ghost sm" x-show="(job.counts.error||0) + (job.counts.not_found||0) > 0" @click="retryJob()">Riprova quelli mancanti</button>
            <button class="danger sm" @click="askPurge()">Elimina</button>
            <button class="ghost sm" x-show="soloJob" @click="soloJob=false; loadJobs()">Tutte le importazioni</button>
            <button class="ghost sm" x-show="!soloJob" @click="job=null; items=[]">Chiudi</button>
          </header>
          <div class="body tight">
            <div class="fase">
              <div>
                <strong x-text="fase(job)"></strong>
                <div class="hint" x-text="prossimoPasso(job)"></div>
              </div>
              <div class="grow"></div>
              <div class="barcode" style="max-width:320px" x-html="barcode(job)"></div>
            </div>

            <template x-if="review.on">
              <div class="review">
                <div class="review-head">
                  <div>
                    <strong x-text="'Scheda ' + (review.i + 1) + ' di ' + review.ids.length"></strong>
                    <div class="hint gtin" x-text="review.item ? review.item.gtin : ''"></div>
                  </div>
                  <div class="grow"></div>
                  <div class="review-bar"><i :style="'width:' + Math.round(review.i * 100 / review.ids.length) + '%'"></i></div>
                  <button class="ghost sm" @click="review.on = false">Chiudi</button>
                </div>

                <template x-if="review.item">
                  <div class="review-body">
                    <div class="review-pic">
                      <template x-if="edit.images.length && edit.images[0]">
                        <img :src="edit.images[0]" alt="">
                      </template>
                      <template x-if="!edit.images.length || !edit.images[0]">
                        <div class="hint" style="text-align:center">nessuna immagine</div>
                      </template>
                      <div class="hint" x-text="edit.images.length + ' immagini'"></div>
                    </div>

                    <div class="review-main">
                      <div class="row" style="margin-bottom:8px">
                        <span class="badge" :class="itemBadge(review.item.status)"
                              x-text="itemLabel(review.item.status)"></span>
                        <span class="hint"
                              x-text="review.item.source ? tt('fonte: {0}', t(review.item.source)) : 'nessuna fonte'"></span>
                      </div>

                      <div class="field"><label>Nome prodotto</label>
                        <input type="text" x-model="edit.title"></div>

                      <div class="grid-3">
                        <div class="field"><label>Marca</label>
                          <input type="text" x-model="edit.brand"></div>
                        <div class="field"><label>Codice produttore</label>
                          <input type="text" class="mono" x-model="edit.mpn"></div>
                        <div class="field"><label>Categoria</label>
                          <input type="text" x-model="edit.category_name"></div>
                      </div>

                      <div class="field"><label>Categoria sul sito <span class="obbl">obbligatoria</span></label>
                        <select x-ref="rcat" x-model.number="edit.category_id"
                                :class="!edit.category_id && 'manca'">
                          <option value="" disabled>— scegli la categoria —</option>
                          <template x-for="c in catValide" :key="'rc' + c.id">
                            <option :value="c.id" :selected="c.id == edit.category_id" x-text="c.name + ' (' + c.count + ')'"></option>
                          </template>
                        </select>
                        <p class="hint" x-show="!edit.category_id && edit.category_name"
                           x-text="'La fonte lo classifica come «' + edit.category_name + '». Scegli la categoria del tuo sito.'"></p>
                      </div>

                      <div class="prezzi">
                        <div class="field"><label>Prezzo</label>
                          <input type="text" class="mono big" x-ref="prezzo" x-model="edit.regular_price"
                                 placeholder="129,90" @keydown.enter="reviewSave()"></div>
                        <div class="field"><label>Prezzo scontato</label>
                          <input type="text" class="mono big" x-model="edit.sale_price"
                                 placeholder="facoltativo" @keydown.enter="reviewSave()"></div>
                      </div>

                      <template x-if="review.err">
                        <div class="notice n-err" style="margin:10px 0 0" x-text="review.err"></div>
                      </template>
                      <template x-if="!review.err && review.item.issues && review.item.issues.length">
                        <div class="notice n-warn" style="margin:10px 0 0">
                          Manca: <span x-text="review.item.issues.map(k => (review.labels || {})[k] || k).join(', ')"></span>
                        </div>
                      </template>

                      <details style="margin-top:12px">
                        <summary class="hint" x-text="'Descrizione e ' + edit.attributes.length + ' specifiche'"></summary>
                        <div class="field" style="margin-top:10px"><label>Descrizione</label>
                          <textarea x-model="edit.description" rows="6" style="font-family:var(--sans)"></textarea></div>
                        <div class="specs">
                          <table><tbody>
                            <template x-for="(a, i) in edit.attributes" :key="'ra' + i">
                              <tr><td x-text="a.name"></td><td x-text="a.value"></td></tr>
                            </template>
                          </tbody></table>
                        </div>
                      </details>
                    </div>
                  </div>
                </template>

                <div class="review-foot">
                  <button class="ghost" @click="reviewPrev()" :disabled="review.i === 0">Indietro</button>
                  <button class="ghost" @click="reviewNext()">Salta</button>
                  <button class="danger" x-show="review.item && review.item.can_delete" @click="eliminaReviewItem()">Elimina scheda</button>
                  <div class="grow"></div>
                  <span class="hint" x-show="review.saving">salvo…</span>
                  <button class="ok" @click="reviewSave()"
                          x-text="review.i + 1 >= review.ids.length ? 'Salva e pubblica i pronti' : 'Salva e vai avanti'"></button>
                </div>
              </div>
            </template>

            <div style="padding:12px 16px" class="row">
              <template x-for="f in itemFilters" :key="f.key">
                <button class="sm filtro" @click="itemFilter=f.key; loadItems()"
                        :class="[itemFilter===f.key ? 'on' : '', (job.counts[f.key] || 0) > 0 ? 'f-' + f.key : 'vuoto']"
                        x-text="f.label + ' (' + (job.counts[f.key] || 0) + ')'"></button>
              </template>
              <button class="ghost sm" @click="itemFilter=null; loadItems()">Tutti</button>
              <div class="grow"></div>
              <button class="ghost sm" @click="openPrices()">Prezzi in blocco</button>
            </div>

            <template x-if="pricesOpen">
              <div style="padding:0 16px 16px">
                <div class="notice n-warn" style="margin-bottom:10px">
                  Una riga per prodotto: <code>EAN prezzo prezzo_scontato</code>. Il terzo valore è
                  facoltativo. Vanno bene spazi, virgole, punto e virgola o una colonna incollata da Excel.
                </div>
                <textarea x-model="pricesText" rows="8" style="font-family:var(--mono)"></textarea>
                <div class="row" style="margin-top:8px">
                  <button @click="savePrices()">Applica i prezzi</button>
                  <button class="ghost" @click="pricesOpen=false">Chiudi</button>
                </div>
              </div>
            </template>
            <table>
              <thead><tr>
                <th style="width:140px">EAN</th><th>Prodotto</th><th>Fonte</th>
                <th class="right" style="width:110px">Prezzo</th>
                <th style="width:130px">Esito</th><th style="width:150px"></th>
              </tr></thead>
              <tbody>
                <template x-for="it in items" :key="it.id">
                  <tr>
                    <td class="gtin" x-text="it.gtin"></td>
                    <td>
                      <div x-text="it.title || '— nessuna scheda trovata —'"></div>
                      <div class="hint" x-show="it.brand" x-text="it.brand"></div>
                      <div class="hint" x-show="it.error || it.status==='not_found'"
                           x-text="isAdmin ? it.error : erroreGentile(it)"></div>
                    </td>
                    <td class="hint" x-text="it.source || '—'"></td>
                    <td class="right num">
                      <div x-text="it.regular_price ? (it.regular_price + ' €') : '—'"></div>
                      <div class="hint" x-show="it.sale_price" x-text="it.sale_price + ' € scontato'"></div>
                    </td>
                    <td><span class="badge" :class="itemBadge(it.status)" x-text="itemLabel(it.status)"></span></td>
                    <td class="right">
                      <button class="sm" @click="editItem(it.id)"
                              :class="(it.status === 'not_found' || it.status === 'incomplete') ? 'warn' : 'ghost'"
                              x-text="it.status === 'not_found' ? 'Compila' : 'Modifica'"></button>
                      <button class="ghost sm" x-show="it.title" @click="preview(it.id)">Vedi</button>
                      <button class="ghost sm" x-show="it.status === 'not_found' || it.status === 'error'"
                              @click="apriPerche(it.id, it.title || it.gtin)">Perché?</button>
                      <button class="danger sm" x-show="it.can_delete" @click="eliminaItemJob(it)">Elimina</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template x-if="!items.length">
              <div class="empty"><p>Nessuna riga con questo filtro.</p></div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- ========================================================== CATEGORIE -->
  <template x-if="tab==='categories'">
    <div class="stack">
      <div class="card">
        <header>
          <h2>Categorie del sito</h2>
          <div class="grow"></div>
          <select style="max-width:280px" x-model.number="form.site_id" @change="onSiteChange()">
            <template x-for="s in sites" :key="s.id">
              <option :value="s.id" :selected="s.id == form.site_id" x-text="s.name"></option>
            </template>
          </select>
          <button class="ghost sm" @click="loadTaxonomy(true)">Rileggi dal sito</button>
          <button class="ghost sm" @click="apriGuida('categorie')" title="Come si aggiungono, rinominano, ordinano ed eliminano le categorie, con esempi">📖 Istruzioni</button>
        </header>
        <div class="body">
          <p class="hint" style="margin-top:0">
            Le categorie del negozio, nell'ordine in cui le mostra il sito: da qui si creano, anche dentro
            un'altra, si rinominano, si eliminano e si mettono in ordine trascinandole o con le frecce.
          </p>


          <template x-if="taxError">
            <div class="notice n-err" x-text="taxError"></div>
          </template>

          <div class="row cat-nuova">
            <input type="text" x-model="catNuova.name" maxlength="190" placeholder="Nome della nuova categoria"
                   @keydown.enter="creaCategoria()">
            <label class="hint" for="cat-dentro">Dentro</label>
            <select id="cat-dentro" x-model.number="catNuova.parent">
              <option :value="0" :selected="catNuova.parent == 0">— nessuna: categoria principale —</option>
              <template x-for="c in catValide" :key="'np' + c.id">
                <option :value="c.id" :selected="c.id == catNuova.parent" x-text="c.name" translate="no"></option>
              </template>
            </select>
            <button @click="creaCategoria()" :disabled="!catNuova.name.trim() || catNuova.busy || ordineCambiato"
                    :title="ordineCambiato ? t('Prima salva o annulla il nuovo ordine.') : ''">Crea</button>
          </div>

          <template x-if="ordineCambiato">
            <div class="notice n-warn cat-avviso">
              <span>Ordine cambiato: salvalo per portarlo sul sito.</span>
              <span class="row" style="gap:8px">
                <button class="ghost sm" @click="annullaOrdine()">Annulla</button>
                <button class="sm" @click="salvaOrdine()" :disabled="catBusy">Salva l'ordine</button>
              </span>
            </div>
          </template>

          <ul class="cat-albero">
            <template x-for="r in righeCategorie" :key="'cr' + r.c.id">
              <li class="cat-riga" :draggable="catRinomina.id === r.c.id ? 'false' : 'true'"
                  :class="{ 'trascinata': catTrascinata === r.c.id, 'bersaglio': catBersaglio === r.c.id }"
                  :style="'padding-left:' + (10 + r.livello * 24) + 'px'"
                  @dragstart="trascinaInizio($event, r.c)" @dragend="trascinaFine()"
                  @dragover="trascinaSopra($event, r.c)" @drop="trascinaRilascia($event, r.c)">
                <span class="cat-maniglia" aria-hidden="true">&#8942;&#8942;</span>
                <template x-if="catRinomina.id !== r.c.id">
                  <span class="cat-nome" x-text="r.c.nome || r.c.name" translate="no"></span>
                </template>
                <template x-if="catRinomina.id === r.c.id">
                  <input type="text" class="cat-rinomina" x-model="catRinomina.name" maxlength="190"
                         aria-label="Nuovo nome della categoria" translate="no"
                         @keydown.enter.prevent="salvaRinomina()" @keydown.escape.prevent="annullaRinomina()"
                         x-init="$nextTick(() => { $el.focus(); $el.select(); })">
                </template>
                <span class="hint num" x-text="r.c.count + ' prod.'"></span>
                <span class="grow"></span>
                <template x-if="catRinomina.id === r.c.id">
                  <span class="row cat-azioni">
                    <button class="sm" @click="salvaRinomina()" :disabled="!catRinomina.name.trim() || catRinomina.busy">Salva</button>
                    <button class="ghost sm" @click="annullaRinomina()" :disabled="catRinomina.busy">Annulla</button>
                  </span>
                </template>
                <template x-if="catRinomina.id !== r.c.id">
                  <span class="row cat-azioni">
                    <button class="ghost sm icona" @click="spostaCategoria(r.c, -1)" :disabled="r.primo"
                            title="Sposta su" aria-label="Sposta su">&#9650;</button>
                    <button class="ghost sm icona" @click="spostaCategoria(r.c, 1)" :disabled="r.ultimo"
                            title="Sposta giù" aria-label="Sposta giù">&#9660;</button>
                    <button class="ghost sm" @click="iniziaRinomina(r.c)">Rinomina</button>
                    <button class="danger sm" @click="chiediEliminaCategoria(r.c)" :disabled="ordineCambiato">Elimina</button>
                  </span>
                </template>
              </li>
            </template>
          </ul>
          <template x-if="!righeCategorie.length && !taxError">
            <div class="empty"><p>Nessuna categoria sul sito: crea la prima qui sopra.</p></div>
          </template>
          <p class="hint" x-show="righeCategorie.length">
            <span x-show="righeCategorie.some(r => r.livello > 0)">Le sottocategorie si spostano solo fra loro, sotto la loro categoria.</span>
            «Senza categoria» non compare: è quella di riserva di WooCommerce.
          </p>
        </div>
      </div>

      <div class="card">
        <header><h2>Attributi e marche del sito</h2></header>
        <div class="body">
          <div class="grid-2">
            <div>
              <h3>Attributi globali</h3>
              <div class="specs">
                <table><tbody>
                  <template x-for="a in attributes" :key="a.id">
                    <tr><td x-text="a.name"></td><td class="right hint mono" x-text="a.slug"></td></tr>
                  </template>
                </tbody></table>
              </div>
            </div>
            <div>
              <h3>Marche</h3>
              <div class="specs">
                <table><tbody>
                  <template x-for="b in brands" :key="b.id">
                    <tr><td x-text="b.name"></td></tr>
                  </template>
                </tbody></table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================ GUIDA -->
  <template x-if="tab==='guida'">
    <div class="stack pagina-guida">
      <div class="card">
        <header><h2>Guida</h2></header>
        <div class="body">
          <p class="hint" style="margin-top:0">Tutto quello che serve per usare il portale, con esempi.</p>
          <nav class="guida-indice">
            <button class="ghost sm" @click="vaiGuida('import')">Caricare i prodotti</button>
            <button class="ghost sm" @click="vaiGuida('stati')">Gli stati dei prodotti</button>
            <button class="ghost sm" @click="vaiGuida('categorie')">Le categorie</button>
          </nav>
        </div>
      </div>

      <div class="card legenda" id="guida-import">
        <header><h2>Caricare i prodotti</h2></header>
        <div class="body">
          <ol class="passi">
            <li>
              <span class="n">1</span>
              <div><p><strong>Incolla i codici</strong> nel riquadro «Aggiungi prodotti» della pagina Prodotti: l'EAN (le cifre sotto il codice a barre)
                oppure il codice del produttore (es. <span class="mono">97924465</span>), uno per riga. Non il tuo codice di magazzino.</p>
                <img class="passo-img" :src="'/static/aiuto/import/' + linguaAiuto + '/incolla.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
                     alt="Esempio: codici incollati nel riquadro e pulsante per cercare le schede"></div>
            </li>
            <li>
              <span class="n">2</span>
              <div><p><strong>Premi «Cerca le schede»</strong>. Cerchiamo nome, foto, descrizione e specifiche sul web,
                nella lingua scelta. Ci vuole qualche secondo a prodotto: le righe compaiono man mano nella tabella «I tuoi prodotti».</p>
                <img class="passo-img" :src="'/static/aiuto/import/' + linguaAiuto + '/cerca.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
                     alt="Esempio: ricerca in corso, con le righe che aspettano la scheda"></div>
            </li>
            <li>
              <span class="n">3</span>
              <div><p><strong>Metti categoria e prezzo</strong> direttamente in tabella (quelli li sai solo tu).
                Seleziona più righe per assegnare la stessa categoria a tutte in un colpo.</p>
                <img class="passo-img" :src="'/static/aiuto/import/' + linguaAiuto + '/categoria-prezzo.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
                     alt="Esempio: righe a cui mancano categoria e prezzo"></div>
            </li>
            <li>
              <span class="n">4</span>
              <div><p><strong>Premi «Pubblica sul sito»</strong>: i prodotti pronti vanno online. I codici già sul sito vengono aggiornati, non duplicati.</p>
                <img class="passo-img" :src="'/static/aiuto/import/' + linguaAiuto + '/pubblica.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
                     alt="Esempio: prodotti pronti da pubblicare e prodotto già sul sito"></div>
            </li>
          </ol>

          <h3 id="guida-stati" class="guida-sotto">Gli stati dei prodotti</h3>
          <div class="stati-legenda">
            <div class="voce"><span class="pill p-in_corso">In ricerca…</span><span>stiamo cercando la scheda, aspetta.</span></div>
            <div class="voce"><span class="pill p-da_completare">Manca: prezzo, categoria</span><span>scheda trovata, tocca a te: scrivi quello che manca nella riga.</span></div>
            <div class="voce"><span class="pill p-pronto">Pronto da pubblicare</span><span>tutto compilato: aspetta solo «Pubblica sul sito».</span></div>
            <div class="voce"><span class="pill p-sul_sito">Sul sito</span><span>pubblicato. «Vedi sul sito» lo apre; se lo modifichi qui, si aggiorna anche lì.</span></div>
            <div class="voce"><span class="pill p-non_trovato">Non trovato</span><span>nessun sito pubblica questo codice, o chi lo pubblica non si lascia leggere: «Perché?» ti dice cosa è successo, poi «Compila a mano» o prova col codice produttore.</span></div>
            <div class="voce"><span class="pill p-problema">Problema</span><span>qualcosa è andato storto nella ricerca: «Riprova».</span></div>
            <div class="voce"><span class="pill p-in_corso">In ricerca…</span><span>con la scritta «motori bloccati» sotto: i motori di ricerca ci hanno rallentati, riprovo da solo all'ora indicata.</span></div>
          </div>

          <p class="hint" style="margin-top:12px">
            <strong>Ultimo carico / Tutti i prodotti</strong>: la tabella mostra di norma solo i prodotti dell'ultimo carico, così quelli vecchi non sono sempre tra i piedi.
            Col menu accanto a «I tuoi prodotti» passi a «Da sistemare» (tutto ciò che aspetta te, di qualunque carico) o a «Tutti i prodotti».
            Lo <strong>Storico</strong> in alto tiene i carichi passati uno per uno.
          </p>
        </div>
      </div>

      <div class="card" id="guida-categorie">
        <header>
          <h2>Le categorie</h2>
          <div class="grow"></div>
          <button class="ghost sm" @click="go('categories')">Vai alle categorie</button>
        </header>
        <div class="body istruzioni-corpo">
          <p style="margin-top:0">Dalla pagina Categorie si aggiungono, si rinominano, si eliminano e si mettono in ordine le categorie del negozio: ogni modifica va sul sito.</p>
          <h4>Aggiungere una categoria</h4>
          <p>Scrivi il nome, scegli in «Dentro» dove metterla e premi Crea (o Invio).</p>
          <div class="istruzioni-esempi">
            <figure>
              <figcaption>«Dentro» su nessuna: categoria principale</figcaption>
              <p>La nuova categoria è principale e va in fondo all'elenco, sotto tutte le altre. Poi la puoi spostare dove vuoi.</p>
              <img :src="'/static/aiuto/categorie/' + linguaAiuto + '/principale.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
                   alt="Esempio: categoria principale aggiunta in fondo all'elenco">
            </figure>
            <figure>
              <figcaption>«Dentro» su una categoria: sottocategoria</figcaption>
              <p>La nuova categoria diventa una sottocategoria di quella scelta e va sotto di lei, dopo le sottocategorie che ha già. «Dentro» resta sulla stessa categoria, così ne aggiungi altre di fila.</p>
              <img :src="'/static/aiuto/categorie/' + linguaAiuto + '/sottocategoria.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
                   alt="Esempio: sottocategoria aggiunta sotto la categoria scelta">
            </figure>
          </div>

          <h4>Rinominare</h4>
          <p>Premi Rinomina sulla riga, scrivi il nuovo nome e premi Salva (o Invio); Annulla (o Esc) lascia tutto com'era. Il nome cambia anche sul sito, l'indirizzo della categoria resta lo stesso.</p>
          <img :src="'/static/aiuto/categorie/' + linguaAiuto + '/rinomina.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
               alt="Esempio: una categoria mentre la si rinomina">

          <h4>Mettere in ordine</h4>
          <p>Trascina una categoria dalla maniglia a sinistra oppure usa le frecce, poi premi «Salva l'ordine» per portare l'ordine sul sito, o Annulla. Le sottocategorie si spostano solo fra loro.</p>
          <img :src="'/static/aiuto/categorie/' + linguaAiuto + '/ordine.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
               alt="Esempio: categoria spostata e avviso per salvare l'ordine">

          <h4>Eliminare</h4>
          <p>Premi Elimina: prima di confermare, una finestra dice quanti prodotti e sottocategorie ci sono dentro. I prodotti restano sul sito, le sottocategorie salgono di un livello. Non si torna indietro.</p>
          <img :src="'/static/aiuto/categorie/' + linguaAiuto + '/elimina.png'" @load="$el.style.width = ($el.naturalWidth / 2) + 'px'" loading="lazy"
               alt="Esempio: conferma prima di eliminare una categoria">
        </div>
      </div>
    </div>
  </template>


  <!-- ============================================================ NEGOZIO -->
  <template x-if="tab==='shop'">
    <div class="stack">
      <div class="card">
        <header><h2>Dati del negozio</h2></header>
        <div class="body">
          <p class="hint" style="margin-top:0">
            Questi dati restano dentro il portale: servono a te e a chi lavora sul catalogo.
            Non vengono scritti sul sito né mandati a nessuno.
          </p>

          <div class="logo-drop" style="margin:14px 0 18px">
            <template x-if="profile.logo">
              <img :src="profile.logo + '?v=' + logoBust" alt="Logo del negozio">
            </template>
            <template x-if="!profile.logo">
              <div class="hint">Nessun logo caricato.</div>
            </template>
            <div class="grow"></div>
            <label class="btn ghost sm" style="margin:0;cursor:pointer">
              Carica logo
              <input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"
                     style="display:none" @change="uploadLogo($event)">
            </label>
            <button class="danger sm" x-show="profile.logo" @click="removeLogo()">Rimuovi</button>
          </div>
          <p class="hint" style="margin-top:-10px">PNG, JPG, WebP o SVG. Massimo 2 MB.</p>

          <div class="grid-2" style="margin-top:16px">
            <div class="field"><label for="pf-legal">Ragione sociale</label>
              <input id="pf-legal" type="text" x-model="profile.legal_name"></div>
            <div class="field"><label for="pf-web">Sito web</label>
              <input id="pf-web" type="text" x-model="profile.website" placeholder="https://"></div>
          </div>
          <div class="grid-3">
            <div class="field"><label for="pf-vat">Partita IVA</label>
              <input id="pf-vat" type="text" class="mono" x-model="profile.vat_number"></div>
            <div class="field"><label for="pf-cf">Codice fiscale</label>
              <input id="pf-cf" type="text" class="mono" x-model="profile.tax_code"></div>
            <div class="field"><label for="pf-sdi">Codice SDI</label>
              <input id="pf-sdi" type="text" class="mono" x-model="profile.sdi_code"></div>
          </div>

          <h3 style="margin:8px 0 10px">Sede</h3>
          <div class="field"><label for="pf-addr">Indirizzo</label>
            <input id="pf-addr" type="text" x-model="profile.address"></div>
          <div class="grid-3">
            <div class="field"><label for="pf-zip">CAP</label>
              <input id="pf-zip" type="text" class="mono" x-model="profile.zip_code"></div>
            <div class="field"><label for="pf-city">Comune</label>
              <input id="pf-city" type="text" x-model="profile.city"></div>
            <div class="field"><label for="pf-prov">Provincia</label>
              <input id="pf-prov" type="text" class="mono" x-model="profile.province" maxlength="4"></div>
          </div>

          <h3 style="margin:8px 0 10px">Contatti</h3>
          <div class="grid-3">
            <div class="field"><label for="pf-tel">Telefono</label>
              <input id="pf-tel" type="text" x-model="profile.phone"></div>
            <div class="field"><label for="pf-mail">Email</label>
              <input id="pf-mail" type="email" x-model="profile.contact_email"></div>
            <div class="field"><label for="pf-pec">PEC</label>
              <input id="pf-pec" type="email" x-model="profile.pec"></div>
          </div>

          <div class="row" style="margin-top:8px">
            <button @click="saveProfile()">Salva i dati</button>
          </div>
        </div>
      </div>

      <template x-if="currentSite && currentSite.resync_enabled">
        <div class="card">
          <header><h2>Aggiornamento notturno</h2></header>
          <div class="body">
            <dl class="kv">
              <dt>Quando</dt><dd x-text="resyncLabel(currentSite)"></dd>
              <dt>Ultimo giro</dt>
              <dd x-text="currentSite.last_resync_at ? (fmtDate(currentSite.last_resync_at) + ' — ' + currentSite.last_resync_msg) : 'non ancora eseguito'"></dd>
            </dl>
            <p class="hint" style="margin-top:12px">
              Ogni notte le schede già a catalogo vengono ricercate di nuovo e aggiornate dove
              serve. Gli aggiornamenti non consumano la quota: quella la consumano solo i
              prodotti nuovi. Se vuoi cambiare orario o cosa viene aggiornato, scrivici.
            </p>
          </div>
        </div>
      </template>

      <div class="card">
        <header><h2>Abbonamento</h2></header>
        <div class="body">
          <template x-if="sub">
            <dl class="kv">
              <dt>Stato</dt><dd><span class="badge" :class="sub.allowed ? 'b-ok' : 'b-err'" x-text="sub.status_label"></span></dd>
              <dt>Piano</dt><dd x-text="sub.plan || '—'"></dd>
              <dt>Scadenza</dt><dd x-text="sub.expires_at ? fmtDay(sub.expires_at) : 'nessuna'"></dd>
              <dt>Quota mensile</dt><dd class="num" x-text="sub.quota ? (sub.used + ' su ' + sub.quota) : (sub.used + ' pubblicati, nessun limite')"></dd>
            </dl>
          </template>
          <p class="hint" style="margin-top:14px">
            Piano, scadenza e quota li imposta l'amministratore del portale. Senza abbonamento attivo
            le schede si scaricano e si vedono in anteprima, ma non si pubblicano sul sito.
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================ CLIENTI -->
  <template x-if="tab==='clients' && isAdmin">
    <div class="stack">
      <div class="card">
        <header>
          <h2>Clienti</h2>
          <div class="grow"></div>
          <button class="sm" @click="editClient(null)">Nuovo cliente</button>
        </header>
        <div class="body tight">
          <table>
            <thead><tr>
              <th>Cliente</th><th>Lingua schede</th><th>Siti</th>
              <th class="right">Mese</th><th class="right">Abbonamento</th><th></th>
            </tr></thead>
            <tbody>
              <template x-for="c in clients" :key="c.id">
                <tr>
                  <td>
                    <div x-text="c.name"></div>
                    <div class="hint" x-text="c.users.map(u => u.email).join(', ')"></div>
                  </td>
                  <td><span class="badge b-wait" translate="no" x-text="nomeLingua(c.content_lang)"></span></td>
                  <td class="hint" x-text="c.sites.map(s => s.name).join(', ') || '—'"></td>

        </div>

  <!-- =============================================================== SITI -->
  <template x-if="tab==='sites' && isAdmin">
    <div class="card">
      <header>
        <h2>Siti collegati</h2>
        <div class="grow"></div>
        <button class="sm" @click="editSite(null)">Nuovo sito</button>
      </header>
      <div class="body tight">
        <table>
          <thead><tr><th>Sito</th><th>Cliente</th><th>Collegamento</th><th></th></tr></thead>
          <tbody>
            <template x-for="s in allSites" :key="s.id">
              <tr>
                <td>
                  <div x-text="s.name"></div>
                  <div class="hint mono" x-text="s.base_url"></div>
                </td>
                <td x-text="s.client_name"></td>
                <td>
                  <span class="badge" :class="s.last_ping_ok ? 'b-ok' : (s.has_keys ? 'b-warn' : 'b-err')"
                        x-text="s.last_ping_ok ? 'Collegato' : (s.has_keys ? 'Da verificare' : 'Chiavi mancanti')"></span>

                  <button class="ghost sm" @click="editSite(s)">Modifica</button>

              </tr>

          </tbody>
        </table>
        <template x-if="!allSites.length"><div class="empty"><p>Nessun sito collegato.</p></div></template>
      </div>

  <!-- ============================================================ UTENTI -->
  <template x-if="tab==='users' && isAdmin">
    <div class="card">
      <header>
        <h2>Utenti</h2>
        <div class="grow"></div>
        <button class="sm" @click="editUser(null)">Nuovo utente</button>
      </header>
      <div class="body tight">
        <table>
          <thead><tr><th>Email</th><th>Cliente</th><th>Ruolo</th><th>Ultimo accesso</th><th></th></tr></thead>
          <tbody>
            <template x-for="u in users" :key="u.id">

                  <button class="ghost sm" @click="editUser(u)">Modifica</button>

          </tbody>
