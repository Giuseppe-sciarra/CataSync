                    <input id="sc-marca" type="text" x-model="scheda.marca" maxlength="120" :disabled="!scheda.marche_attive"
                           list="sc-marche" :placeholder="scheda.marche_attive ? '' : t('Marche non attive sul sito')">
                    <datalist id="sc-marche">
                      <template x-for="b in brands" :key="'sb' + b.id"><option :value="b.name"></option></template>
                    </datalist></div>
                </div>
                <div class="grid-2">
                  <div class="field"><label for="sc-sku">SKU</label>
                    <input id="sc-sku" type="text" class="mono" x-model="scheda.sku" maxlength="100"></div>
                  <div class="field"><label for="sc-ean">EAN</label>
                    <input id="sc-ean" type="text" class="mono" inputmode="numeric" x-model="scheda.ean" maxlength="20"></div>
                </div>

                <h3>Prezzo e scorte</h3>
                <template x-if="scheda.tipo !== 'variable'">
                  <div class="grid-2">
                    <div class="field"><label for="sc-prezzo">Prezzo</label>
                      <input id="sc-prezzo" type="text" class="mono" inputmode="decimal" x-model="scheda.prezzo" placeholder="129,90"></div>
                    <div class="field"><label for="sc-sconto">Prezzo scontato</label>
                      <input id="sc-sconto" type="text" class="mono" inputmode="decimal" x-model="scheda.scontato" placeholder="facoltativo"></div>
                  </div>
                </template>
                <template x-if="scheda.tipo === 'variable'">
                  <p class="hint">I prezzi stanno sulle varianti: si cambiano dal sito.</p>
                </template>
                <label class="spunta-riga">
                  <input type="checkbox" x-model="scheda.gestisci_scorte"> Gestisci le scorte (quantità in magazzino)
                </label>
                <div class="grid-2">
                  <template x-if="scheda.gestisci_scorte">
                    <div class="field"><label for="sc-qta">Quantità</label>
                      <input id="sc-qta" type="number" min="0" x-model.number="scheda.quantita"></div>
                  </template>
                  <template x-if="!scheda.gestisci_scorte">
                    <div class="field"><label for="sc-disp">Disponibilità</label>
                      <select id="sc-disp" x-model="scheda.disponibilita">
                        <option value="instock" :selected="scheda.disponibilita === 'instock'">Disponibile</option>
                        <option value="outofstock" :selected="scheda.disponibilita === 'outofstock'">Esaurito</option>
                        <option value="onbackorder" :selected="scheda.disponibilita === 'onbackorder'">Su ordinazione</option>
                      </select></div>
                  </template>
                </div>

                <h3>Categorie</h3>
                <div class="mag-chip-riga" style="margin-bottom:8px">
                  <template x-for="(id, i) in scheda.categorie" :key="'scc' + id">
                    <span class="mag-chip con-x">
                      <span x-text="nomeCatMag(id) || id" translate="no"></span>
                      <button type="button" class="x" @click="scheda.categorie.length > 1 && scheda.categorie.splice(i, 1)"
                              :disabled="scheda.categorie.length < 2" title="Togli" aria-label="Togli">×</button>
                    </span>
                  </template>
                </div>
                <div class="row riga">
                  <select x-model.number="nuovaCatScheda" aria-label="Categoria da aggiungere">
                    <option :value="0" :selected="!nuovaCatScheda">— aggiungi una categoria —</option>
                    <template x-for="r in righeMagCat" :key="'nc' + r.c.id">
                      <option :value="r.c.id" :disabled="scheda.categorie.includes(r.c.id)"
                              x-text="'  '.repeat(r.livello) + r.c.nome" translate="no"></option>
                    </template>
                  </select>
                  <button class="ghost sm" @click="aggiungiCatScheda()" :disabled="!nuovaCatScheda">Aggiungi</button>
                </div>
              </section>

              <section>
                <h3>Foto</h3>
                <p class="hint" style="margin-top:0">La prima è la foto principale. Con le frecce cambi l'ordine.</p>
                <div class="scheda-foto">
                  <template x-for="(f, i) in scheda.immagini" :key="'sf' + i + (f.id || f.src)">
                    <figure :class="i === 0 && 'principale'">
                      <img :src="f.thumb || f.src" alt="" loading="lazy">
                      <span class="badge-foto" x-show="i === 0">Principale</span>
                      <div class="foto-azioni">
                        <button type="button" class="ghost sm icona" @click="spostaFoto(i, -1)" :disabled="i === 0" title="Prima" aria-label="Prima">◀</button>
                        <button type="button" class="ghost sm icona" @click="spostaFoto(i, 1)" :disabled="i === scheda.immagini.length - 1" title="Dopo" aria-label="Dopo">▶</button>
                        <button type="button" class="danger sm icona" @click="scheda.immagini.splice(i, 1)" title="Togli la foto" aria-label="Togli la foto">×</button>
                      </div>
                    </figure>
                  </template>
                  <template x-if="!scheda.immagini.length">
                    <div class="hint">Nessuna foto.</div>
                  </template>
                </div>
                <div class="row riga" style="margin-top:10px">
                  <input type="text" class="mono" x-model="nuovaFotoUrl" placeholder="Indirizzo di una foto (https://…)" aria-label="Indirizzo di una foto"
                         @keydown.enter.prevent="aggiungiFotoUrl()">
                  <button class="ghost sm" @click="aggiungiFotoUrl()" :disabled="!/^https?:\/\//i.test(nuovaFotoUrl.trim())">Aggiungi</button>
                </div>
                <div class="row" style="margin-top:8px" x-show="scheda.carica_foto">
                  <label class="btn ghost sm" style="margin:0;cursor:pointer">
                    <span x-text="schedaFotoBusy ? t('Carico…') : t('Carica dal computer')"></span>
                    <input type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none" @change="caricaFotoScheda($event)">
                  </label>
                  <span class="hint">JPG, PNG o WebP, fino a 8 MB.</span>
                </div>
                <p class="hint" x-show="!scheda.carica_foto">Per caricare foto dal computer serve PUBLIC_URL nella configurazione del portale: intanto si aggiungono con l'indirizzo.</p>
              </section>
            </div>

            <template x-for="campo in ['descrizione_breve', 'descrizione']" :key="'ed' + campo">
              <section class="scheda-testo">
                <div class="row" style="justify-content:space-between">
                  <h3 x-text="campo === 'descrizione' ? t('Descrizione') : t('Descrizione breve')"></h3>
                  <button type="button" class="ghost sm" x-show="!schedaSpeciale[campo]" @click="schedaHtml[campo] = !schedaHtml[campo]"
                          x-text="schedaHtml[campo] ? t('Editor') : t('HTML')"></button>
                </div>
                <template x-if="schedaSpeciale[campo]">
                  <div class="notice n-warn">Questa descrizione contiene elementi speciali (video, codice, moduli): per non rovinarli si modifica dal sito.</div>
                </template>
                <template x-if="!schedaSpeciale[campo] && !schedaHtml[campo]">
                  <div class="editor-ricco">
                    <div class="editor-barra" role="toolbar" :aria-label="t('Formattazione')">
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'bold')" title="Grassetto"><b translate="no">A</b></button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'italic')" title="Corsivo"><i translate="no">A</i></button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'underline')" title="Sottolineato"><u translate="no">A</u></button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'formatBlock', 'h3')" title="Titoletto">H</button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'formatBlock', 'p')" title="Paragrafo">¶</button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'insertUnorderedList')" title="Elenco puntato">•</button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'insertOrderedList')" title="Elenco numerato">1.</button>
                      <button type="button" class="ghost sm" @mousedown.prevent="linkEd(campo)" title="Link">🔗</button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'unlink')" title="Togli il link">⛓</button>
                      <button type="button" class="ghost sm" @mousedown.prevent="comandoEd(campo, 'removeFormat')" title="Togli la formattazione">⌫</button>
                    </div>
                    <div class="editor-area" contenteditable="true" :data-campo="campo" translate="no"
                         :class="campo === 'descrizione_breve' && 'breve'"
                         x-init="$el.innerHTML = htmlPulito(scheda[campo])"
                         @input="scheda[campo] = $el.innerHTML" @blur="scheda[campo] = $el.innerHTML"></div>
                  </div>
                </template>
                <template x-if="!schedaSpeciale[campo] && schedaHtml[campo]">
                  <textarea class="mono editor-html" x-model="scheda[campo]" :rows="campo === 'descrizione' ? 14 : 5" translate="no"></textarea>
                </template>
              </section>
            </template>

            <section class="scheda-testo">
              <h3>Specifiche</h3>
              <p class="hint" style="margin-top:0">Più valori si separano con «|». Le specifiche globali del sito e quelle usate per le varianti si cambiano dal sito.</p>
              <p class="hint" style="margin-top:0" x-show="scheda.specifiche_plugin">Sono le Specifiche prodotto del sito (TD Product Specs): le stesse della scheda in vetrina e dei filtri.</p>
              <template x-for="(s, i) in scheda.specifiche" :key="'ss' + i">
                <div class="row riga" style="margin-bottom:6px">
                  <input type="text" style="flex:0 0 220px" x-model="s.nome" placeholder="Nome" :disabled="s.globale || s.variante" aria-label="Nome della specifica">
                  <input type="text" x-model="s.valore" placeholder="Valore" :disabled="s.globale || s.variante" aria-label="Valore della specifica">
                  <span class="hint" x-show="s.globale || s.variante" x-text="s.variante ? t('varianti') : t('globale')"></span>
                  <button type="button" class="danger sm" x-show="!s.globale && !s.variante" @click="scheda.specifiche.splice(i, 1)">Togli</button>
                </div>
              </template>
              <button type="button" class="ghost sm" @click="scheda.specifiche.push({ nome: '', valore: '', globale: false, variante: false })">Aggiungi specifica</button>
            </section>

            <div class="scheda-piede">
              <button @click="salvaSchedaMag()" :disabled="schedaBusy" x-text="schedaBusy ? t('Salvo sul sito…') : t('Salva sul sito')"></button>
              <button class="ghost" @click="modal.kind = null">Annulla</button>
              <span class="hint" x-show="schedaCambiata" >Ci sono modifiche da salvare.</span>
            </div>
          </div>
        </template>

        <!-- magazzino: nel cestino, per sempre, svuota -->
        <template x-if="modal.kind==='magcestina'">
          <div>
            <p style="margin-top:0">Sposti nel cestino del sito <strong x-text="modal.data.p.nome" translate="no"></strong>.</p>
            <dl class="kv">
              <dt>Sul negozio</dt>
              <dd>Sparisce subito: non si vede e non si compra più.</dd>
              <dt>Nel cestino</dt>
              <dd x-text="tt('Resta {0} giorni, poi WordPress lo elimina da solo. Fino ad allora lo ripristini dal Cestino del Magazzino o da WordPress (Prodotti → Cestino).', modal.data.giorni)"></dd>
            </dl>
            <div class="row" style="margin-top:16px;gap:10px">
              <button class="danger" @click="cestinaMag()" :disabled="mag.busy">Sposta nel cestino</button>
              <button class="ghost" @click="modal.kind = null">Annulla</button>
            </div>
          </div>
        </template>
        <template x-if="modal.kind==='magpersempre'">
          <div>
            <div class="notice n-err" style="margin-top:0">
              Elimini per sempre dal sito <strong x-text="modal.data.p.nome" translate="no"></strong>. Non si torna indietro.
            </div>
            <p class="hint">Le immagini restano nella libreria media del sito.</p>
            <div class="row" style="margin-top:16px;gap:10px">
              <button class="danger" @click="perSempreMag()" :disabled="mag.busy">Elimina per sempre</button>
              <button class="ghost" @click="modal.kind = null">Annulla</button>
            </div>
          </div>
        </template>
        <template x-if="modal.kind==='magsvuota'">
          <div>
            <div class="notice n-err" style="margin-top:0"
                 x-text="modal.data.quanti === 1 ? t('Elimini per sempre il prodotto che è nel cestino del sito. Non si torna indietro.') : tt('Elimini per sempre tutti i {0} prodotti nel cestino del sito, anche quelli cestinati da WordPress. Non si torna indietro.', modal.data.quanti)"></div>
            <p class="hint">Le immagini restano nella libreria media del sito.</p>
            <div class="row" style="margin-top:16px;gap:10px">
              <button class="danger" @click="svuotaMag()" :disabled="mag.busy">Svuota il cestino</button>
              <button class="ghost" @click="modal.kind = null">Annulla</button>
            </div>
          </div>
        </template>

        <!-- fonte dati -->
        <template x-if="modal.kind==='provider'">
          <div>
            <p class="hint" style="margin-top:0" x-text="modal.data.descrizione"></p>

            <div class="grid-2">
              <div class="field"><label>Nome</label>
                <input type="text" x-model="modal.data.name"></div>
              <div class="field"><label>Ordine di prova</label>
                <input type="number" min="0" max="999" x-model.number="modal.data.priority">
                <p class="hint">Numero più basso = provata prima.</p>
              </div>
            </div>

            <template x-if="modal.data.kind === 'http_json'">
              <div>
                <div class="grid-2">
                  <div class="field"><label>Utente del portale</label>
                    <input type="text" class="mono" x-model="modal.data.username"></div>
                  <div class="field"><label>Password o chiave</label>
                    <input type="text" class="mono" x-model="modal.data.secret"
                           :placeholder="modal.data.secret_masked || 'lascia vuoto per non cambiarla'"></div>
                </div>
                <div class="field"><label>Indirizzo delle API</label>
                  <input type="text" class="mono" x-model="modal.data.endpoint"
                         placeholder="https://api.esempio.it/prodotti/{gtin}">
                  <p class="hint">
                    Lo trovi nell'area riservata del portale, sezione API. Metti
                    <code>{gtin}</code> dove va il codice EAN.
                  </p>
                </div>
              </div>
            </template>

            <template x-if="modal.data.kind === 'web'">
              <div>
                <div class="notice n-ok" style="margin-top:0">
                  Non c'è niente da configurare qui: la pagina del produttore la trova da
                  sola col motore di ricerca impostato nel pannello, pagina <strong>Impostazioni</strong>.
                  Funziona anche su marche mai viste prima.
                </div>

                <details style="margin-top:12px">
                  <summary class="hint">Ho già gli indirizzi di certe marche, li voglio usare</summary>
                  <div class="field" style="margin-top:10px">
                    <label>Indirizzi fissi, uno per riga</label>
                <textarea x-model="modal.data.endpoint" rows="6" class="mono"
                          placeholder="https://www.bosch-home.it/ricerca?q={gtin}&#10;https://www.samsung.com/it/search/?searchvalue={gtin}"></textarea>
                <p class="hint">
                  Un indirizzo per marca. Segnaposto: <code>{gtin}</code> per l'EAN,
                  <code>{mpn}</code> per il codice produttore. Vanno bene sia la pagina
                  prodotto diretta, se conosci lo schema degli indirizzi, sia la ricerca
                  interna del sito.
                </p>
                    <p class="hint">
                      Se metti qualcosa qui, si usano solo questi e la ricerca automatica
                      viene saltata. Segnaposto: <code>{gtin}</code> e <code>{mpn}</code>.
                    </p>
                  </div>
                </details>

                <div class="notice n-warn" style="margin-top:12px">
                  In entrambi i casi si rispetta il file <code>robots.txt</code> di ogni sito, si
                  aspetta un secondo e mezzo fra una pagina e l'altra e i siti protetti da verifiche
                  anti-bot si saltano. Se la pagina non conferma il codice richiesto, la scheda viene
                  scartata invece di importare il prodotto sbagliato.
                </div>
              </div>
            </template>

            <template x-if="modal.data.kind === 'http_json'">
              <details style="margin-top:10px">
                <summary class="hint">Impostazioni avanzate</summary>
                <div class="grid-2" style="margin-top:10px">
                  <div class="field"><label>Autenticazione</label>
                    <select x-model="modal.data.auth_mode">
                      <option value="none">Nessuna</option>
                      <option value="basic">Utente e password</option>
                      <option value="header">Intestazione HTTP</option>
                      <option value="query">Parametro nell'indirizzo</option>
                      <option value="bearer">Bearer token</option>
                    </select>
                  </div>
                  <div class="field"><label>Nome intestazione o parametro</label>
                    <input type="text" class="mono" x-model="modal.data.auth_name" placeholder="X-Api-Key"></div>
                </div>
                <div class="field"><label>Dove inizia la scheda nella risposta</label>
                  <input type="text" class="mono" x-model="modal.data.root_path" placeholder="dati.articolo"></div>
                <div class="field"><label>Mappa dei campi</label>
                  <textarea x-model="modal.data.field_map_text" rows="10" class="mono"></textarea>
                  <p class="hint">
                    A sinistra il campo del portale, a destra dove trovarlo nella risposta.
                    Per le liste usa <code>[]</code>. I prezzi non si mappano: li mette il cliente.
                  </p>
                </div>
              </details>
            </template>

            <div class="row" style="margin-top:14px">
              <input type="text" class="mono" style="max-width:190px" x-model="providerTestGtin"
                     placeholder="EAN di prova">
              <button class="ghost" @click="testProvider()">Prova la fonte</button>
              <div class="grow"></div>
              <button class="danger" x-show="modal.data.id" @click="deleteProvider()">Disattiva</button>
            </div>

            <template x-if="providerTest">
              <div style="margin-top:12px">
                <div class="notice" :class="providerTest.ok ? 'n-ok' : 'n-err'"
                     x-text="providerTest.ok ? 'La fonte risponde e i campi sono stati riconosciuti.' : (providerTest.error || 'Risposta ricevuta ma senza nome prodotto: controlla le impostazioni.')"></div>
                <template x-if="providerTest.product">
                  <div x-html="renderProduct(providerTest.product)"></div>
                </template>
                <template x-if="providerTest.raw_sample">
                  <details style="margin-top:10px">
                    <summary class="hint">Risposta grezza, per capire dove stanno i campi</summary>
                    <pre class="mono" style="white-space:pre-wrap;font-size:11.5px;max-height:240px;overflow:auto"
                         x-text="providerTest.raw_sample"></pre>
                  </details>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- account: conferma con la password prima di spegnere qualcosa -->
        <template x-if="modal.kind==='sicpwd'">
          <div>
            <p style="margin-top:0" x-text="modal.data.testo"></p>
            <div class="field">
              <label for="sic-pwd">La tua password</label>
              <input id="sic-pwd" type="password" x-model="modal.data.password" autocomplete="current-password"
                     x-init="$nextTick(() => $el.focus())" @keydown.enter="eseguiConPassword()">
            </div>
            <div class="row" style="margin-top:16px;gap:10px">
              <button :class="modal.data.pericolo ? 'danger' : ''" @click="eseguiConPassword()"
                      :disabled="sic.busy || !modal.data.password" x-text="modal.data.bottone"></button>
              <button class="ghost" @click="modal.kind = null">Annulla</button>
            </div>
          </div>
        </template>

        <!-- account: i codici di riserva, mostrati una volta sola -->
        <template x-if="modal.kind==='sicriserva'">
          <div>
            <div class="notice n-warn" style="margin-top:0">
              Salvali adesso: dopo non si possono più vedere. Servono se perdi il telefono o la chiave, e ognuno vale una volta sola.
            </div>
            <div class="codici-riserva" translate="no">
              <template x-for="c in modal.data.codici" :key="c"><span x-text="c"></span></template>
            </div>
            <div class="row" style="gap:10px">
              <button class="ghost" @click="copiaRiserva()" x-text="modal.data.copiati ? 'Copiati ✓' : 'Copia'"></button>
              <button class="ghost" @click="scaricaRiserva()">Scarica</button>
              <div class="grow"></div>
              <button @click="modal.kind = null">Li ho salvati</button>
            </div>
          </div>
        </template>

        <!-- utente -->
        <template x-if="modal.kind==='user'">
          <div>
            <div class="field"><label>Email</label>
              <input type="email" x-model="modal.data.email" placeholder="nome@dominio.it"
                     autocomplete="off" spellcheck="false"></div>
            <div class="field"><label>Nome e cognome</label>
              <input type="text" x-model="modal.data.full_name"></div>

            <div class="field">
              <label x-text="modal.data.id ? 'Nuova password' : 'Password'"></label>
              <div class="row" style="flex-wrap:nowrap">
                <input type="text" class="mono" x-model="modal.data.password"
                       autocomplete="new-password" spellcheck="false"
                       :placeholder="modal.data.id ? 'lasciala vuota per non cambiarla' : 'vuota = generata dal portale'">
                <button type="button" class="ghost sm" @click="generaPassword()">Genera</button>
              </div>
              <p class="hint">Almeno 10 caratteri. La vedi solo tu: mandala al cliente come preferisci.</p>
            </div>
            <div class="grid-2">
              <div class="field"><label>Ruolo</label>
                <select x-model="modal.data.role">
                  <option value="client">Cliente</option><option value="admin">Amministratore</option>
                </select>
              </div>
              <div class="field"><label>Cliente collegato</label>
                <select x-model.number="modal.data.client_id">
                  <option value="">Nessuno</option>
                  <template x-for="c in clients" :key="c.id">
                    <option :value="c.id" :selected="c.id == modal.data.client_id" x-text="c.name"></option>
                  </template>
                </select>
              </div>
            </div>
            <label style="display:flex;gap:8px;align-items:center;font-weight:500">
              <input type="checkbox" x-model="modal.data.is_active" style="width:auto"> Può accedere
            </label>
            <template x-if="modal.data.generated_password">
              <div class="notice n-ok" style="margin-top:14px">
                Password generata, mandagliela tu: <code x-text="modal.data.generated_password"></code>
              </div>
            </template>
          </div>
        </template>

      </div>
      <footer x-show="modal.kind !== 'preview' && modal.kind !== 'purge' && modal.kind !== 'perche' && modal.kind !== 'catdel' && !String(modal.kind).startsWith('mag') && !String(modal.kind).startsWith('sic')">
        <button class="ghost" @click="modal.kind=null">Annulla</button>
        <button @click="saveModal()">Salva</button>
      </footer>
    </div>
  </div>
</template>

<script src="/static/passkey.js?v={{ static_v }}"></script>
<script src="/static/hub.js?v={{ static_v }}"></script>
</body>
</html>
