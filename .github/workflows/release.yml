name: Release

# Una release a ogni modifica di main, appena «Validate source» (test e build
# dell'immagine) è passata. Numero, note, VERSION.txt e CHANGELOG.md li decide
# .github/scripts/rilascio.py: leggi lì le regole.
#   - VERSION.txt con un numero nuovo  → esce quel numero
#   - altrimenti                       → ultima release + 1 (2.0.0 → 2.0.1)
#   - «[minor]» / «[major]» nel titolo del commit → 2.1.0 / 3.0.0
#   - «[skip ci]» nel commit → niente controlli e niente release
#   - numeri in docs/releases/ritirate.txt → release e tag tolti

on:
  workflow_run:
    workflows: ["Validate source"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Version, notes, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          NOME: CataSync
        run: python3 .github/scripts/rilascio.py
